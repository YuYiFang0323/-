<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>後台內容管理系統</title>
</head>
<body>
  <!-- 載入 Decap CMS -->
  <script src="https://cdn.jsdelivr.net/npm/decap-cms@^3.0.0/dist/decap-cms.js"></script>
  
  <script>
    // 1. 注入預覽區樣式
    CMS.registerPreviewStyle(`    
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
        line-height: 1.6;
        color: #2c3e50;
        background-color: #f8f9fa;
        padding: 2rem;
      }
      .card {
        background: #ffffff;
        border-radius: 12px;
        border: 1px solid #e2e8f0;
        box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.05);
        max-width: 380px;
        margin: 0 auto;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        overflow: hidden;
      }
      .card-cover-wrapper {
        position: relative;
        width: 100%;
        aspect-ratio: 16 / 9;
        overflow: hidden;
        background-color: #f1f5f9;
        cursor: grab;
        user-select: none;
      }
      .card-cover-wrapper:active {
        cursor: grabbing;
      }
      .card-cover-wrapper img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        pointer-events: none;
      }
      .focal-point-marker {
        position: absolute;
        width: 14px;
        height: 14px;
        background-color: #ef4444;
        border: 2px solid #ffffff;
        border-radius: 50%;
        transform: translate(-50%, -50%);
        box-shadow: 0 0 4px rgba(0,0,0,0.4);
        pointer-events: none;
      }
      .drag-hint {
        position: absolute;
        bottom: 8px;
        right: 8px;
        background: rgba(0,0,0,0.6);
        color: white;
        padding: 2px 8px;
        border-radius: 4px;
        font-size: 11px;
        pointer-events: none;
      }
      .card-body {
        padding: 1.5rem;
        display: flex;
        flex-direction: column;
        flex-grow: 1;
      }
      .card h3 {
        font-size: 1.25rem;
        color: #0f172a;
        margin-bottom: 0.8rem;
        line-height: 1.4;
        font-weight: 700;
      }
      .card .tags-wrapper {
        margin-bottom: 0.8rem;
      }
      .card .tag {
        display: inline-block;
        background: #eff6ff;
        color: #2563eb;
        padding: 0.25rem 0.65rem;
        border-radius: 6px;
        font-size: 0.82rem;
        font-weight: 500;
        margin-right: 0.4rem;
        margin-bottom: 0.4rem;
      }
      .card p {
        color: #475569;
        font-size: 0.95rem;
        margin-bottom: 1.2rem;
        white-space: pre-line;
        word-break: break-all;
      }
      .card a.btn {
        display: inline-block;
        text-align: center;
        background: #3b82f6;
        color: #ffffff;
        padding: 0.5rem 1rem;
        border-radius: 6px;
        text-decoration: none;
        font-size: 0.9rem;
        font-weight: 500;
        margin-top: auto;
      }
    `, { raw: true });

    // 解析數值為純數字 (0~100)
    function parseFocalValue(val) {
      if (val === undefined || val === null || val === '') return 50;
      var num = parseInt(String(val).replace(/[^0-9]/g, ''), 10);
      return isNaN(num) ? 50 : Math.min(Math.max(num, 0), 100);
    }

    // 2. 註冊研究成果預覽組件
    var ResearchPreview = createClass({
      getInitialState: function() {
        return { 
          isDragging: false, 
          startX: 0, 
          startY: 0, 
          posX: 50, 
          posY: 50 
        };
      },

      handleMouseDown: function(e) {
        e.preventDefault();

        var entry = this.props.entry;
        var curX = parseFocalValue(entry.getIn(['data', 'focal_x']));
        var curY = parseFocalValue(entry.getIn(['data', 'focal_y']));

        this.setState({
          isDragging: true,
          startX: e.clientX,
          startY: e.clientY,
          posX: curX,
          posY: curY
        });
      },

      handleMouseMove: function(e) {
        if (!this.state.isDragging) return;
        
        var deltaX = e.clientX - this.state.startX;
        var deltaY = e.clientY - this.state.startY;

        // 調整靈敏度，計算 0 ~ 100 的百分比點
        var newX = Math.min(Math.max(this.state.posX - (deltaX * 0.3), 0), 100);
        var newY = Math.min(Math.max(this.state.posY - (deltaY * 0.3), 0), 100);

        var roundX = Math.round(newX);
        var roundY = Math.round(newY);

        this.setState({
          posX: newX,
          posY: newY,
          startX: e.clientX,
          startY: e.clientY
        });

        // 核心修正：拖曳途中即時更新 CMS 表單 DOM 中的對應數字輸入框，實現零延遲自動填寫
        this.updateCmsInputs(roundX, roundY);
      },

      handleMouseUp: function() {
        if (this.state.isDragging) {
          this.setState({ isDragging: false });
          var roundX = Math.round(this.state.posX);
          var roundY = Math.round(this.state.posY);
          
          // 放開時確認將純數字填入輸入框並觸發 input/change 事件
          this.updateCmsInputs(roundX, roundY);
        }
      },

      // 關鍵函數：直接定位並安全輸入純數字（解決數字鎖死與連動失敗問題）
      updateCmsInputs: function(x, y) {
        try {
          var inputs = window.parent.document.querySelectorAll('input[type="number"], input[id*="focal"]');
          var inputX, inputY;

          inputs.forEach(function(input) {
            var id = (input.id || '').toLowerCase();
            var name = (input.name || '').toLowerCase();
            if (id.includes('focal_x') || name.includes('focal_x') || id.endsWith('-x')) inputX = input;
            if (id.includes('focal_y') || name.includes('focal_y') || id.endsWith('-y')) inputY = input;
          });

          // 如果沒比對到，依序指派前兩個數字輸入框
          if (!inputX && inputs[0]) inputX = inputs[0];
          if (!inputY && inputs[1]) inputY = inputs[1];

          var setNativeValue = function(element, value) {
            var valueSetter = Object.getOwnPropertyDescriptor(element, 'value').set;
            var prototype = Object.getPrototypeOf(element);
            var prototypeValueSetter = Object.getOwnPropertyDescriptor(prototype, 'value').set;

            if (prototypeValueSetter && valueSetter !== prototypeValueSetter) {
              prototypeValueSetter.call(element, value);
            } else if (valueSetter) {
              valueSetter.call(element, value);
            } else {
              element.value = value;
            }
            element.dispatchEvent(new Event('input', { bubbles: true }));
            element.dispatchEvent(new Event('change', { bubbles: true }));
          };

          if (inputX) setNativeValue(inputX, x);
          if (inputY) setNativeValue(inputY, y);
        } catch (err) {
          console.warn('自動同步 XY 欄位時發生警告:', err);
        }
      },

      render: function() {
        var entry = this.props.entry;
        var getAsset = this.props.getAsset;
        
        var title = entry.getIn(['data', 'title']) || '我是研究標題';
        var tagsRaw = entry.getIn(['data', 'tags']);
        var description = entry.getIn(['data', 'description']) || entry.getIn(['data', 'summary']) || '';
        var link = entry.getIn(['data', 'link']) || entry.getIn(['data', 'pdf_url']);
        var cover = entry.getIn(['data', 'cover']);

        // 讀取當前 XY 數值（確保轉為純數字）
        var numX = this.state.isDragging 
          ? Math.round(this.state.posX) 
          : parseFocalValue(entry.getIn(['data', 'focal_x']));
        var numY = this.state.isDragging 
          ? Math.round(this.state.posY) 
          : parseFocalValue(entry.getIn(['data', 'focal_y']));

        var focalX = numX + '%';
        var focalY = numY + '%';

        var tagList = [];
        if (tagsRaw) {
          tagList = tagsRaw.split(/[,;]/).map(function(t) { return t.trim(); }).filter(Boolean);
        }

        var hasLink = false;
        if (link && typeof link === 'string') {
          var cleanLink = link.trim();
          var urlPattern = /^(https?:\/\/)[^\s/$.?#].[^\s]*$/i;
          hasLink = urlPattern.test(cleanLink);
        }

        var coverElement = null;
        if (cover) {
          var coverAsset = getAsset(cover);
          var coverUrl = coverAsset ? coverAsset.toString() : cover;

          coverElement = h('div', {
            className: 'card-cover-wrapper',
            onMouseDown: this.handleMouseDown,
            onMouseMove: this.handleMouseMove,
            onMouseUp: this.handleMouseUp,
            onMouseLeave: this.handleMouseUp,
            style: { cursor: this.state.isDragging ? 'grabbing' : 'grab' }
          },
            h('img', {
              src: coverUrl,
              style: { 
                objectPosition: focalX + ' ' + focalY,
                transform: 'scale(1.2)',
                userSelect: 'none',
                pointerEvents: 'none'
              }
            }),
            // 紅點標記：直觀顯示當前焦點所在之處
            h('div', {
              className: 'focal-point-marker',
              style: { left: focalX, top: focalY }
            }),
            h('span', { className: 'drag-hint' }, '✢ 按住拖曳挪動焦點 (X:' + numX + ' Y:' + numY + ')')
          );
        }

        return h('div', { className: 'card' },
          coverElement,
          h('div', { className: 'card-body' },
            h('div', {},
              h('h3', {}, title),
              tagList.length > 0 && h('div', { className: 'tags-wrapper' },
                tagList.map(function(tag, i) {
                  return h('span', { key: i, className: 'tag' }, tag);
                })
              ),
              h('p', {}, description)
            ),
            hasLink && h('a', { href: link, target: '_blank', className: 'btn' }, '查看論文/連結')
          )
        );
      }
    });

    CMS.registerPreviewTemplate('research', ResearchPreview);
  </script>
</body>
</html>
