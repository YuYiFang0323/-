<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>後台內容管理系統</title>
  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
</head>
<body>
  <!-- 使用 jsDelivr CDN -->
  <script src="https://cdn.jsdelivr.net/npm/decap-cms@^3.0.0/dist/decap-cms.js"></script>
  
  <script>
    // 取得 Decap CMS 內建的 createClass 與 h (React.createElement)
    var createClass = window.createClass || React.createClass;
    var h = window.h || React.createElement;

    // 1. 定義「研究成果 (research)」的自訂卡片預覽範本
    var ResearchPreview = createClass({
      render: function() {
        var entry = this.props.entry;
        var title = entry.getIn(['data', 'title']) || '我是研究標題';
        var tagsStr = entry.getIn(['data', 'tags']) || '';
        var description = entry.getIn(['data', 'description']) || '';
        var link = entry.getIn(['data', 'link']);

        // 將逗號隔開的標籤字串轉為陣列
        var tags = tagsStr ? tagsStr.split(/[,;]/).map(function(t) { return t.trim(); }).filter(Boolean) : [];
        var hasLink = link && link !== '000000' && link.trim() !== '';

        return h('div', { style: { padding: '30px', background: '#f8f9fa', minHeight: '100vh', fontFamily: '-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif' } },
          h('div', {
            style: {
              background: '#ffffff',
              borderRadius: '16px',
              padding: '28px',
              border: '1px solid #e2e8f0',
              boxShadow: '0 10px 15px -3px rgba(0, 0, 0, 0.05), 0 4px 6px -2px rgba(0, 0, 0, 0.02)',
              maxWidth: '380px',
              margin: '0 auto'
            }
          },
            // 論文標題
            h('h3', { style: { fontSize: '1.35rem', color: '#0f172a', marginBottom: '16px', fontWeight: '700', lineHeight: '1.3' } }, title),
            
            // 關鍵字標籤 (藍色小方塊)
            tags.length > 0 ? h('div', { style: { marginBottom: '16px', display: 'flex', flexWrap: 'wrap', gap: '8px' } },
              tags.map(function(tag, idx) {
                return h('span', {
                  key: idx,
                  style: {
                    background: '#eff6ff',
                    color: '#2563eb',
                    padding: '6px 12px',
                    borderRadius: '8px',
                    fontSize: '0.85rem',
                    fontWeight: '600'
                  }
                }, tag);
              })
            ) : null,

            // 摘要簡述 (支援自動折行、字再多也不會發社交蒸發)
            h('p', { style: { color: '#475569', fontSize: '0.95rem', lineHeight: '1.6', marginBottom: '20px', whiteSpace: 'pre-line', wordBreak: 'break-word' } }, description),

            // 查看論文/PDF 連結
            hasLink ? h('a', {
              href: link,
              target: '_blank',
              style: {
                display: 'block',
                textAlign: 'center',
                background: '#2563eb',
                color: '#ffffff',
                padding: '10px 16px',
                borderRadius: '8px',
                textDecoration: 'none',
                fontSize: '0.9rem',
                fontWeight: '600'
              }
            }, '查看論文 / PDF') : null
          )
        );
      }
    });

    // 2. 註冊範本給 research 集合
    CMS.registerPreviewTemplate('research', ResearchPreview);
  </script>
</body>
</html>
