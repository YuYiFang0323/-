<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>後台內容管理系統</title>  
</head>
<body>
  <!-- 載入 Decap CMS -->
  <script src="https://cdn.jsdelivr.net/npm/decap-cms@^3.0.0/dist/decap-cms.js"></script>
  
  <script>
    // 直接用 CSS 強制覆蓋預覽區 (iframe) 的所有樣式
    CMS.registerPreviewStyle(`
      /* 1. 鋪滿背景底色 */
      body {
        background-color: #f8f9fa !important;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif !important;
        padding: 30px 15px !important;
        margin: 0 !important;
        box-sizing: border-box !important;
      }

      /* 2. 把整份預覽內容強制包裹成「獨立白色卡片」 */
      div[class*="nc-widgetPreview"],
      div[class*="PreviewPaneFrame"] > div,
      body > div {
        background: #ffffff !important;
        border-radius: 16px !important;
        padding: 24px !important;
        border: 1px solid #e2e8f0 !important;
        box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.05) !important;
        max-width: 380px !important;
        margin: 0 auto 20px auto !important;
      }

      /* 3. 標題樣式（論文標題） */
      h1, h2, h3 {
        font-size: 1.25rem !important;
        color: #0f172a !important;
        font-weight: 700 !important;
        line-height: 1.4 !important;
        margin-top: 0 !important;
        margin-bottom: 12px !important;
      }

      /* 4. 內文與摘要：解決超長文字破版、消失的問題 */
      p, div, span {
        color: #475569 !important;
        font-size: 0.9rem !important;
        line-height: 1.6 !important;
        word-break: break-all !important; /* 強制超長文字自動換行 */
        white-space: pre-wrap !important;
      }

      /* 5. 欄位標籤文字加粗（例如：摘要簡述:） */
      strong, b {
        color: #1e293b !important;
        font-weight: 600 !important;
      }
    `, { raw: true });
  </script>
</body>
</html>
