<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>後台內容管理系統</title>
  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
</head>
<body>
  <!-- 使用 jsDelivr CDN，避開 Edge 瀏覽器的 Tracking Block 阻擋 -->
  <script src="https://cdn.jsdelivr.net/npm/decap-cms@^3.0.0/dist/decap-cms.js"></script>
  
  <script>
    // 注入卡片樣式給預覽區 (iframe)
    CMS.registerPreviewStyle(`
      body {
        background-color: #f8f9fa !important;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif !important;
        padding: 24px !important;
        margin: 0 !important;
      }

      /* 外層邊框卡片化 */
      div[class*="PreviewPaneFrame"] > div,
      body > div {
        background: #ffffff !important;
        border-radius: 12px !important;
        padding: 24px !important;
        border: 1px solid #e2e8f0 !important;
        box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.08) !important;
        max-width: 380px !important;
        margin: 0 auto !important;
      }

      /* 標題 */
      h1, h2, h3, div > h1:first-child {
        font-size: 1.35rem !important;
        color: #0f172a !important;
        font-weight: 700 !important;
        margin-top: 0 !important;
        margin-bottom: 12px !important;
        line-height: 1.3 !important;
      }

      /* 內文與摘要 (長文字自動換行不爆掉) */
      p, div {
        color: #475569 !important;
        font-size: 0.95rem !important;
        line-height: 1.6 !important;
        word-break: break-word !important;
        white-space: pre-wrap !important;
      }
    `, { raw: true });
  </script>
</body>
</html>
