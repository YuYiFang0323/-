<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>後台內容管理系統</title>  
</head>
<body>
  <!-- 載入 Decap CMS -->
  <script src="https://cdn.jsdelivr.net/npm/decap-cms@^3.0.0/dist/decap-cms.js"></script>
  
  <script>
    // 1. 注入 1:1 還原前台的 CSS 樣式
    CMS.registerPreviewStyle(`
      /* 隱藏右上角的「點擊進行預覽」按鈕與圖示 */
      [class*="PaneHeader"],
      [class*="PreviewPaneHeader"],
      button[title*="Toggle preview"],
      a[class*="PreviewToggle"] {
        display: none !important;
      }
    `, { raw: true });
    
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        line-height: 1.6;
        color: #2c3e50;
        background-color: #f8f9fa;
        padding: 2rem;
      }

      /* 前台卡片視覺設定 */
      .card {
        background: #ffffff;
        border-radius: 12px;
        padding: 1.8rem;
        border: 1px solid #e2e8f0;
        box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.05);
        max-width: 380px;
        margin: 0 auto;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
      }
      .card h3 {
        font-size: 1.25rem;
        color: #0f172a;
        margin-bottom: 0.8rem;
        line-height: 1.4;
        font-weight: 700;
      }
      .card .tags-wrapper {
        margin-bottom: 0.8rem;
      }
      .card .tag {
        display: inline-block;
        background: #eff6ff;
        color: #2563eb;
        padding: 0.25rem 0.65rem;
        border-radius: 6px;
        font-size: 0.82rem;
        font-weight: 500;
        margin-right: 0.4rem;
        margin-bottom: 0.4rem;
      }
      .card p {
        color: #475569;
        font-size: 0.95rem;
        margin-bottom: 1.2rem;
        white-space: pre-line;
        word-break: break-all;
      }
      .card a.btn {
        display: inline-block;
        text-align: center;
        background: #3b82f6;
        color: #ffffff;
        padding: 0.5rem 1rem;
        border-radius: 6px;
        text-decoration: none;
        font-size: 0.9rem;
        font-weight: 500;
        margin-top: auto;
      }
    `, { raw: true });

    // 2. 註冊研究成果 (research) 的自訂預覽範本
    var ResearchPreview = createClass({
      render: function() {
        var entry = this.props.entry;
        
        // 抓取後台輸入框的數值 (相容 title, tags, description, summary, link)
        var title = entry.getIn(['data', 'title']) || '我是研究標題';
        var tagsRaw = entry.getIn(['data', 'tags']);
        var description = entry.getIn(['data', 'description']) || entry.getIn(['data', 'summary']) || '';
        var link = entry.getIn(['data', 'link']) || entry.getIn(['data', 'pdf_url']);

        // 將逗號分隔的標籤轉為陣列 (例如 MCDM,TOPSIS -> ['MCDM', 'TOPSIS'])
        var tagList = [];
        if (tagsRaw) {
          tagList = tagsRaw.split(/[,;]/).map(function(t) { return t.trim(); }).filter(Boolean);
        }

        // 判斷按鈕是否顯示 (排除 000000 與空值)
        var hasLink = link && link !== '000000' && link.trim() !== '';

        return h('div', { className: 'card' },
          h('div', {},
            h('h3', {}, title),
            tagList.length > 0 && h('div', { className: 'tags-wrapper' },
              tagList.map(function(tag, i) {
                return h('span', { key: i, className: 'tag' }, tag);
              })
            ),
            h('p', {}, description)
          ),
          hasLink && h('a', { href: link, target: '_blank', className: 'btn' }, '查看論文/連結')
        );
      }
    });

    // 3. 強制註冊範本到 research 集合 (註冊多個可能名稱確保抓到)
    CMS.registerPreviewTemplate('research', ResearchPreview);
  </script>
</body>
</html>
