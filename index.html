<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>個人作品集 Portfolio</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      line-height: 1.6;
      color: #2c3e50;
      background-color: #f8f9fa;
    }

    /* 頂部導覽列 */
    header {
      background: #ffffff;
      border-bottom: 1px solid #e9ecef;
      position: sticky;
      top: 0;
      z-index: 1000;
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
    }
    nav {
      max-width: 1000px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1.2rem 2rem;
    }
    .logo {
      font-size: 1.3rem;
      font-weight: 700;
      color: #1a252f;
      text-decoration: none;
    }
    .nav-links {
      display: flex;
      gap: 1.8rem;
      list-style: none;
    }
    .nav-links a {
      color: #495057;
      text-decoration: none;
      font-weight: 500;
      transition: color 0.2s;
    }
    .nav-links a:hover {
      color: #3b82f6;
    }

    /* 主要內容區域 */
    .container {
      max-width: 1000px;
      margin: 0 auto;
      padding: 3rem 1.5rem;
    }

    /* 各區塊標題設計 */
    section {
      margin-bottom: 4rem;
      text-align: center;
    }
    section h2 {
      font-size: 2rem;
      color: #1e293b;
      margin-bottom: 0.5rem;
      display: inline-block;
      position: relative;
    }
    section h2::after {
      content: '';
      display: block;
      width: 45px;
      height: 4px;
      background: #3b82f6;
      margin: 8px auto 0 auto;
      border-radius: 2px;
    }

    /* 卡片網格與樣式 */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 1.8rem;
      margin-top: 2rem;
      text-align: left;
    }

    .card {
      background: #ffffff;
      border-radius: 12px;
      border: 1px solid #e2e8f0;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
      transition: transform 0.2s, box-shadow 0.2s;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      overflow: hidden;
    }
    .card:hover {
      transform: translateY(-4px);
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
    }

    /* 封面圖片等寬與裁切設定 */
    .card-cover {
      width: 100%;
      aspect-ratio: 16 / 9;
      object-fit: cover;
      display: block;
      background-color: #f1f5f9;
    }

    .card-body {
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      flex-grow: 1;
    }

    .card h3 {
      font-size: 1.25rem;
      color: #0f172a;
      margin-bottom: 0.8rem;
      line-height: 1.4;
    }
    .card .tags-wrapper {
      margin-bottom: 0.8rem;
    }
    .card .tag {
      display: inline-block;
      background: #eff6ff;
      color: #2563eb;
      padding: 0.25rem 0.6rem;
      border-radius: 4px;
      font-size: 0.82rem;
      font-weight: 500;
      margin-right: 0.4rem;
      margin-bottom: 0.4rem;
    }
    .card p {
      color: #475569;
      font-size: 0.95rem;
      margin-bottom: 1.2rem;
      white-space: pre-line;
      flex-grow: 1;
    }
    .card a.btn {
      display: inline-block;
      text-align: center;
      background: #3b82f6;
      color: #ffffff;
      padding: 0.5rem 1rem;
      border-radius: 6px;
      text-decoration: none;
      font-size: 0.9rem;
      font-weight: 500;
      transition: background 0.2s;
      margin-top: auto;
    }
    .card a.btn:hover {
      background: #2563eb;
    }

    .empty-msg {
      grid-column: 1 / -1;
      text-align: center;
      color: #94a3b8;
      font-size: 1rem;
      padding: 2rem 0;
    }
  </style>
</head>
<body>

  <header>
    <nav>
      <a href="#" class="logo">My Portfolio</a>
      <ul class="nav-links">
        <li><a href="#research">研究成果</a></li>
        <li><a href="#videos">影音作品</a></li>
        <li><a href="#plans">計畫作品</a></li>
        <li><a href="#competitions">競賽獲獎</a></li>
      </ul>
    </nav>
  </header>

  <div class="container">
    <section id="research">
      <h2>研究成果</h2>
      <div id="research-list" class="grid"><p class="empty-msg">正在載入資料...</p></div>
    </section>

    <section id="videos">
      <h2>影音作品</h2>
      <div id="videos-list" class="grid"><p class="empty-msg">正在載入資料...</p></div>
    </section>

    <section id="plans">
      <h2>計畫作品</h2>
      <div id="plans-list" class="grid"><p class="empty-msg">正在載入資料...</p></div>
    </section>

    <section id="competitions">
      <h2>競賽獲獎</h2>
      <div id="competitions-list" class="grid"><p class="empty-msg">正在載入資料...</p></div>
    </section>
  </div>

  <script>
    const USERNAME = "YuYiFang0323"; 
    const REPO = "MyWeb"; 
    const BRANCH = "main"; // GitHub 預設分支

    // 修正：將路徑轉換為 GitHub Raw 直連網址
    function getImageUrl(path) {
      if (!path) return '';
      
      let cleanPath = path.trim().replace(/^['"]|['"]$/g, '');

      // 若本身已是完整 URL 則直接回傳
      if (cleanPath.startsWith('http://') || cleanPath.startsWith('https://') || cleanPath.startsWith('blob:')) {
        return cleanPath;
      }

      // 移除開頭多餘的斜線與 public/ static/ 前綴
      cleanPath = cleanPath.replace(/^\//, '').replace(/^public\//, '').replace(/^static\//, '');

      // 拼湊 GitHub Raw URL
      return `https://raw.githubusercontent.com/${USERNAME}/${REPO}/${BRANCH}/${cleanPath}`;
    }

    function parseFrontMatter(text) {
      const match = text.match(/^---\r?\n([\s\S]*?)\r?\n---/);
      if (!match) return { description: text };
      const yamlText = match[1];
      const data = {};
      yamlText.split('\n').forEach(line => {
        const colonIndex = line.indexOf(':');
        if (colonIndex !== -1) {
          const key = line.slice(0, colonIndex).trim();
          let value = line.slice(colonIndex + 1).trim();
          if ((value.startsWith('"') && value.endsWith('"')) || (value.startsWith("'") && value.endsWith("'"))) {
            value = value.slice(1, -1);
          }
          data[key] = value;
        }
      });
      return data;
    }

    async function loadDirectoryFiles(folder, containerId, renderFn) {
      const container = document.getElementById(containerId);
      if (!container) return;

      try {
        const apiUrl = `https://api.github.com/repos/${USERNAME}/${REPO}/contents/content/${folder}`;
        const res = await fetch(apiUrl);

        if (res.status === 404) {
          container.innerHTML = '<p class="empty-msg">尚無內容，請至後台新增。</p>';
          return;
        }

        if (!res.ok) throw new Error(`HTTP error! status: ${res.status}`);

        const files = await res.json();
        const mdFiles = files.filter(f => f.name.endsWith('.md'));

        if (mdFiles.length === 0) {
          container.innerHTML = '<p class="empty-msg">尚無內容，請至後台新增。</p>';
          return;
        }

        container.innerHTML = '';
        for (const file of mdFiles) {
          const rawRes = await fetch(file.download_url);
          const text = await rawRes.text();
          const data = parseFrontMatter(text);
          container.innerHTML += renderFn(data);
        }
      } catch (err) {
        console.warn(`[${folder}] 讀取狀態:`, err);
        container.innerHTML = `<p class="empty-msg">尚無內容，請至後台新增。</p>`;
      }
    }

    function isValidUrl(string) {
      if (!string || typeof string !== 'string' || string.trim() === '') return false;
      try {
        const url = new URL(string.trim());
        return url.protocol === 'http:' || url.protocol === 'https:';
      } catch (_) {
        return false;
      }
    }

    function renderResearch(data) {
      const tags = data.tags ? data.tags.split(/[,;]/).map(t => `<span class="tag">${t.trim()}</span>`).join('') : '';
      const hasLink = isValidUrl(data.link);
      
      const focalX = data.focal_x || '50%';
      const focalY = data.focal_y || '50%';
      
      const coverUrl = getImageUrl(data.cover);
      const coverHtml = coverUrl ? `<img src="${coverUrl}" class="card-cover" style="object-position: ${focalX} ${focalY};" alt="封面" onerror="this.style.display='none'">` : '';

      return `
        <div class="card">
          ${coverHtml}
          <div class="card-body">
            <div>
              <h3>${data.title || '無標題'}</h3>
              ${tags ? `<div class="tags-wrapper">${tags}</div>` : ''}
              <p>${data.description || ''}</p>
            </div>
            ${hasLink ? `<a href="${data.link}" target="_blank" class="btn">查看論文/連結</a>` : ''}
          </div>
        </div>
      `;
    }

    function renderVideo(data) {
      const focalX = data.focal_x || '50%';
      const focalY = data.focal_y || '50%';
      const coverUrl = getImageUrl(data.cover);
      const coverHtml = coverUrl ? `<img src="${coverUrl}" class="card-cover" style="object-position: ${focalX} ${focalY};" alt="封面" onerror="this.style.display='none'">` : '';
      return `
        <div class="card">
          ${coverHtml}
          <div class="card-body">
            <div>
              <h3>${data.title || '無標題'}</h3>
              <p>${data.description || ''}</p>
            </div>
            ${data.youtube_url ? `<a href="${data.youtube_url}" target="_blank" class="btn">觀看影片</a>` : ''}
          </div>
        </div>
      `;
    }

    function renderProject(data) {
      const focalX = data.focal_x || '50%';
      const focalY = data.focal_y || '50%';
      const coverUrl = getImageUrl(data.cover);
      const coverHtml = coverUrl ? `<img src="${coverUrl}" class="card-cover" style="object-position: ${focalX} ${focalY};" alt="封面" onerror="this.style.display='none'">` : '';
      return `
        <div class="card">
          ${coverHtml}
          <div class="card-body">
            <div>
              <h3>${data.title || '無標題'}</h3>
              <p style="margin-bottom:0.5rem; font-size:0.88rem; color:#64748b;">
                <strong>角色：</strong>${data.role || '-'}<br>
                <strong>時間：</strong>${data.period || '-'}
              </p>
              <p>${data.description || ''}</p>
            </div>
          </div>
        </div>
      `;
    }

    document.addEventListener('DOMContentLoaded', () => {
      loadDirectoryFiles('research', 'research-list', renderResearch);
      loadDirectoryFiles('videos', 'videos-list', renderVideo);
      loadDirectoryFiles('plans', 'plans-list', renderProject);
      loadDirectoryFiles('competitions', 'competitions-list', renderProject);
    });
  </script>
</body>
</html>
