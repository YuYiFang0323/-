<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>後台內容管理系統</title>
</head>
<body>
  <!-- 載入 Decap CMS -->
  <script src="https://cdn.jsdelivr.net/npm/decap-cms@^3.0.0/dist/decap-cms.js"></script>
  
  <script>
    // 1. 注入樣式
    CMS.registerPreviewStyle(`    
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
        line-height: 1.6;
        color: #2c3e50;
        background-color: #f8f9fa;
        padding: 2rem;
      }
      .card {
        background: #ffffff;
        border-radius: 12px;
        border: 1px solid #e2e8f0;
        box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.05);
        max-width: 380px;
        margin: 0 auto;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        overflow: hidden;
      }
      .card-cover-wrapper {
        position: relative;
        width: 100%;
        aspect-ratio: 16 / 9;
        overflow: hidden;
        background-color: #f1f5f9;
        cursor: grab;
        user-select: none;
      }
      .card-cover-wrapper:active {
        cursor: grabbing;
      }
      .card-cover-wrapper img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        pointer-events: none;
      }
      .drag-hint {
        position: absolute;
        bottom: 8px;
        right: 8px;
        background: rgba(0,0,0,0.6);
        color: white;
        padding: 2px 8px;
        border-radius: 4px;
        font-size: 11px;
        pointer-events: none;
      }
      .card-body {
        padding: 1.5rem;
        display: flex;
        flex-direction: column;
        flex-grow: 1;
      }
      .card h3 {
        font-size: 1.25rem;
        color: #0f172a;
        margin-bottom: 0.8rem;
        line-height: 1.4;
        font-weight: 700;
      }
      .card .tags-wrapper {
        margin-bottom: 0.8rem;
      }
      .card .tag {
        display: inline-block;
        background: #eff6ff;
        color: #2563eb;
        padding: 0.25rem 0.65rem;
        border-radius: 6px;
        font-size: 0.82rem;
        font-weight: 500;
        margin-right: 0.4rem;
        margin-bottom: 0.4rem;
      }
      .card p {
        color: #475569;
        font-size: 0.95rem;
        margin-bottom: 1.2rem;
        white-space: pre-line;
        word-break: break-all;
      }
      .card a.btn {
        display: inline-block;
        text-align: center;
        background: #3b82f6;
        color: #ffffff;
        padding: 0.5rem 1rem;
        border-radius: 6px;
        text-decoration: none;
        font-size: 0.9rem;
        font-weight: 500;
        margin-top: auto;
      }
    `, { raw: true });

    // 2. 註冊研究成果預覽組件（修復拖曳與即時同步問題）
    var ResearchPreview = createClass({
      getInitialState: function() {
        return { 
          isDragging: false, 
          startX: 0, 
          startY: 0, 
          posX: 50, 
          posY: 50 
        };
      },

      handleMouseDown: function(e) {
        // 防止瀏覽器預設觸發圖片拖動行為
        e.preventDefault();

        var entry = this.props.entry;
        var rawX = entry.getIn(['data', 'focal_x']);
        var rawY = entry.getIn(['data', 'focal_y']);
        
        var curX = rawX ? parseInt(rawX, 10) : 50;
        var curY = rawY ? parseInt(rawY, 10) : 50;

        this.setState({
          isDragging: true,
          startX: e.clientX,
          startY: e.clientY,
          posX: isNaN(curX) ? 50 : curX,
          posY: isNaN(curY) ? 50 : curY
        });
      },

      handleMouseMove: function(e) {
        if (!this.state.isDragging) return;
        
        var deltaX = e.clientX - this.state.startX;
        var deltaY = e.clientY - this.state.startY;

        var newX = Math.min(Math.max(this.state.posX - (deltaX * 0.25), 0), 100);
        var newY = Math.min(Math.max(this.state.posY - (deltaY * 0.25), 0), 100);

        // 拖曳中僅即時更新內部元件 State，保證畫面流暢不卡頓
        this.setState({
          posX: newX,
          posY: newY,
          startX: e.clientX,
          startY: e.clientY
        });
      },

      handleMouseUp: function() {
        if (this.state.isDragging) {
          this.setState({ isDragging: false });

          // 放開滑鼠時才將新座標一次寫入左側表單，避免中途中斷拖曳
          if (this.props.onChange) {
            var roundX = Math.round(this.state.posX) + '%';
            var roundY = Math.round(this.state.posY) + '%';

            var updatedData = this.props.entry.get('data')
              .set('focal_x', roundX)
              .set('focal_y', roundY);
              
            this.props.onChange(updatedData);
          }
        }
      },

      render: function() {
        var entry = this.props.entry;
        var getAsset = this.props.getAsset;
        
        var title = entry.getIn(['data', 'title']) || '我是研究標題';
        var tagsRaw = entry.getIn(['data', 'tags']);
        var description = entry.getIn(['data', 'description']) || entry.getIn(['data', 'summary']) || '';
        var link = entry.getIn(['data', 'link']) || entry.getIn(['data', 'pdf_url']);
        var cover = entry.getIn(['data', 'cover']);

        // 拖曳中優先使用即時位置，放開後讀取 entry 的資料
        var focalX, focalY;
        if (this.state.isDragging) {
          focalX = Math.round(this.state.posX) + '%';
          focalY = Math.round(this.state.posY) + '%';
        } else {
          focalX = entry.getIn(['data', 'focal_x']) || (Math.round(this.state.posX) + '%');
          focalY = entry.getIn(['data', 'focal_y']) || (Math.round(this.state.posY) + '%');
        }

        var tagList = [];
        if (tagsRaw) {
          tagList = tagsRaw.split(/[,;]/).map(function(t) { return t.trim(); }).filter(Boolean);
        }

        var hasLink = false;
        if (link && typeof link === 'string') {
          var cleanLink = link.trim();
          var urlPattern = /^(https?:\/\/)[^\s/$.?#].[^\s]*$/i;
          hasLink = urlPattern.test(cleanLink);
        }

        var coverElement = null;
        if (cover) {
          var coverAsset = getAsset(cover);
          var coverUrl = coverAsset ? coverAsset.toString() : cover;

          coverElement = h('div', {
            className: 'card-cover-wrapper',
            onMouseDown: this.handleMouseDown,
            onMouseMove: this.handleMouseMove,
            onMouseUp: this.handleMouseUp,
            onMouseLeave: this.handleMouseUp,
            style: { cursor: this.state.isDragging ? 'grabbing' : 'grab' }
          },
            h('img', {
              src: coverUrl,
              style: { 
                objectPosition: focalX + ' ' + focalY,
                transform: 'scale(1.2)',
                userSelect: 'none',
                pointerEvents: 'none'
              }
            }),
            h('span', { className: 'drag-hint' }, '✢ 按住拖曳挪動焦點')
          );
        }

        return h('div', { className: 'card' },
          coverElement,
          h('div', { className: 'card-body' },
            h('div', {},
              h('h3', {}, title),
              tagList.length > 0 && h('div', { className: 'tags-wrapper' },
                tagList.map(function(tag, i) {
                  return h('span', { key: i, className: 'tag' }, tag);
                })
              ),
              h('p', {}, description)
            ),
            hasLink && h('a', { href: link, target: '_blank', className: 'btn' }, '查看論文/連結')
          )
        );
      }
    });

    CMS.registerPreviewTemplate('research', ResearchPreview);
  </script>
</body>
</html>
