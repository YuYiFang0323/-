<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>後台內容管理系統</title>
</head>
<body>
  <!-- 載入 Decap CMS -->
  <script src="https://cdn.jsdelivr.net/npm/decap-cms@^3.0.0/dist/decap-cms.js"></script>
  
  <script>
    // 1. 注入與前台 1:1 還原的 CSS 樣式
    CMS.registerPreviewStyle(`    
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        line-height: 1.6;
        color: #2c3e50;
        background-color: #f8f9fa;
        padding: 2rem;
      }

      /* 前台卡片視覺設定 */
      .card {
        background: #ffffff;
        border-radius: 12px;
        border: 1px solid #e2e8f0;
        box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.05);
        max-width: 380px;
        margin: 0 auto;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        overflow: hidden;
      }

      /* 封面圖可拖拽挪動樣式 */
      .card-cover-wrapper {
        position: relative;
        width: 100%;
        aspect-ratio: 16 / 9;
        overflow: hidden;
        background-color: #f1f5f9;
        cursor: grab;
        user-select: none;
      }
      .card-cover-wrapper:active {
        cursor: grabbing;
      }
      .card-cover-wrapper img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        pointer-events: none;
      }
      .drag-hint {
        position: absolute;
        bottom: 8px;
        right: 8px;
        background: rgba(0,0,0,0.6);
        color: white;
        padding: 2px 8px;
        border-radius: 4px;
        font-size: 11px;
        pointer-events: none;
      }

      .card-body {
        padding: 1.5rem;
        display: flex;
        flex-direction: column;
        flex-grow: 1;
      }

      .card h3 {
        font-size: 1.25rem;
        color: #0f172a;
        margin-bottom: 0.8rem;
        line-height: 1.4;
        font-weight: 700;
      }
      .card .tags-wrapper {
        margin-bottom: 0.8rem;
      }
      .card .tag {
        display: inline-block;
        background: #eff6ff;
        color: #2563eb;
        padding: 0.25rem 0.65rem;
        border-radius: 6px;
        font-size: 0.82rem;
        font-weight: 500;
        margin-right: 0.4rem;
        margin-bottom: 0.4rem;
      }
      .card p {
        color: #475569;
        font-size: 0.95rem;
        margin-bottom: 1.2rem;
        white-space: pre-line;
        word-break: break-all;
      }
      .card a.btn {
        display: inline-block;
        text-align: center;
        background: #3b82f6;
        color: #ffffff;
        padding: 0.5rem 1rem;
        border-radius: 6px;
        text-decoration: none;
        font-size: 0.9rem;
        font-weight: 500;
        margin-top: auto;
      }
    `, { raw: true });

    // 2. 註冊研究成果 (research) 的自訂預覽範本
    var ResearchPreview = createClass({
      getInitialState: function() {
        return { isDragging: false, startY: 0, currentPos: 50 };
      },

      handleMouseDown: function(e) {
        this.setState({
          isDragging: true,
          startY: e.clientY
        });
      },

      handleMouseMove: function(e) {
        if (!this.state.isDragging) return;
        var deltaY = e.clientY - this.state.startY;
        var newPos = Math.min(Math.max(this.state.currentPos - (deltaY * 0.3), 0), 100);
        
        this.setState({
          currentPos: newPos,
          startY: e.clientY
        });

        // 自動將挪動後的新焦點百分比寫入後台資料欄位 focal_y
        this.props.onChange(this.props.entry.get('data').set('focal_y', Math.round(newPos) + '%'));
      },

      handleMouseUp: function() {
        this.setState({ isDragging: false });
      },

      render: function() {
        var entry = this.props.entry;
        
        var title = entry.getIn(['data', 'title']) || '我是研究標題';
        var tagsRaw = entry.getIn(['data', 'tags']);
        var description = entry.getIn(['data', 'description']) || entry.getIn(['data', 'summary']) || '';
        var link = entry.getIn(['data', 'link']) || entry.getIn(['data', 'pdf_url']);
        var cover = entry.getIn(['data', 'cover']);
        var focalY = entry.getIn(['data', 'focal_y']) || (this.state.currentPos + '%');

        // 將逗號分隔的標籤轉為陣列
        var tagList = [];
        if (tagsRaw) {
          tagList = tagsRaw.split(/[,;]/).map(function(t) { return t.trim(); }).filter(Boolean);
        }

        // 嚴格網址格式判斷
        var hasLink = false;
        if (link && typeof link === 'string') {
          var cleanLink = link.trim();
          var urlPattern = /^(https?:\/\/)[^\s/$.?#].[^\s]*$/i;
          hasLink = urlPattern.test(cleanLink);
        }

        // 處理封面圖片與拖拽手勢監聽
        var coverElement = null;
        if (cover) {
          var coverUrl = this.props.getAsset(cover).toString();
          coverElement = h('div', {
            className: 'card-cover-wrapper',
            onMouseDown: this.handleMouseDown,
            onMouseMove: this.handleMouseMove,
            onMouseUp: this.handleMouseUp,
            onMouseLeave: this.handleMouseUp
          },
            h('img', {
              src: coverUrl,
              style: { objectPosition: 'center ' + focalY }
            }),
            h('span', { className: 'drag-hint' }, '↕ 按住拖曳挪動封面')
          );
        }

        return h('div', { className: 'card' },
          coverElement,
          h('div', { className: 'card-body' },
            h('div', {},
              h('h3', {}, title),
              tagList.length > 0 && h('div', { className: 'tags-wrapper' },
                tagList.map(function(tag, i) {
                  return h('span', { key: i, className: 'tag' }, tag);
                })
              ),
              h('p', {}, description)
            ),
            hasLink && h('a', { href: link, target: '_blank', className: 'btn' }, '查看論文/連結')
          )
        );
      }
    });

    // 3. 強制註冊範本到 research 集合
    CMS.registerPreviewTemplate('research', ResearchPreview);
  </script>
</body>
</html>
