<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>後台內容管理系統</title>
</head>
<body>
  <!-- 載入 Decap CMS -->
  <script src="https://cdn.jsdelivr.net/npm/decap-cms@^3.0.0/dist/decap-cms.js"></script>

  <script>
    // 0. 精準根據 DOM 結構搬移 X/Y 軸欄位並重排
    function injectCmsLayoutOverride() {
      // A. 注入樣式
      const styleId = 'decap-exact-image-layout-fix';
      if (!document.getElementById(styleId)) {
        const style = document.createElement('style');
        style.id = styleId;
        style.innerHTML = `
          /* 1. 外層容器 .css-83wr9v：橫向 Flex 不換行 */
          div[class*="ControlContainer"] div.css-83wr9v {
            display: flex !important;
            flex-direction: row !important;
            align-items: center !important;
            justify-content: flex-start !important;
            gap: 16px !important;
            flex-wrap: nowrap !important;
          }

          /* 2. 核心修正：包含圖片與按鈕的 <span> 強制改為橫向 Flex */
          div[class*="ControlContainer"] div.css-83wr9v > span {
            display: flex !important;
            flex-direction: row !important;
            align-items: center !important;
            gap: 12px !important;
            flex-shrink: 0 !important;
          }

          /* 3. 圖片 Wrapper 限制寬度 */
          div[class*="ImageWrapper"] {
            max-width: 140px !important;
            flex-shrink: 0 !important;
            margin: 0 !important;
          }

          /* 4. 按鈕容器 div：直向排列按鈕，位在圖片右側 */
          div[class*="ImageWrapper"] + div {
            display: flex !important;
            flex-direction: column !important;
            gap: 6px !important;
            align-items: flex-start !important;
            justify-content: center !important;
            flex-shrink: 0 !important;
          }

          /* 5. 按鈕基本重置 */
          div[class*="ControlContainer"] button {
            margin: 0 !important;
            width: fit-content !important;
            white-space: nowrap !important;
          }

          /* 6. 搬移動進來的 X 軸、Y 軸容器 */
          .moved-focal-container {
            width: 110px !important;
            margin: 0 !important;
            padding: 8px !important;
            border: 1px dashed #cbd5e1 !important;
            border-radius: 6px !important;
            background: #f8fafc !important;
            flex-shrink: 0 !important;
          }
          .moved-focal-container label, 
          .moved-focal-container [class*="ControlTopbar"] {
            font-size: 12px !important;
            white-space: nowrap !important;
            margin-bottom: 4px !important;
            padding: 0 !important;
          }
          .moved-focal-container input {
            padding: 4px 8px !important;
            height: 32px !important;
            font-size: 14px !important;
          }
        `;
        document.head.appendChild(style);
      }

      // B. DOM 精準搬移邏輯
      try {
        const imageControl = document.querySelector('div[aria-label="image field"]');
        if (!imageControl) return;

        // 找到外層放置的主容器 .css-83wr9v
        const targetTarget = imageControl.querySelector('div.css-83wr9v');
        if (!targetTarget) return;

        const allControls = Array.from(document.querySelectorAll('div[class*="ControlContainer"]'));
        const imgIndex = allControls.indexOf(imageControl);

        if (imgIndex !== -1) {
          const xControl = allControls[imgIndex + 1];
          const yControl = allControls[imgIndex + 2];

          // 搬移 X 軸欄位
          if (xControl && xControl.getAttribute('aria-label') === 'string field' && xControl.parentElement !== targetTarget) {
            xControl.classList.add('moved-focal-container', 'moved-focal-x');
            targetTarget.appendChild(xControl);
          }

          // 搬移 Y 軸欄位
          if (yControl && yControl.getAttribute('aria-label') === 'string field' && yControl.parentElement !== targetTarget) {
            yControl.classList.add('moved-focal-container', 'moved-focal-y');
            targetTarget.appendChild(yControl);
          }
        }
      } catch (err) {
        console.warn('搬移焦點欄位提示:', err);
      }
    }

    // 啟動 MutationObserver 監聽 DOM 動態渲染
    injectCmsLayoutOverride();
    const observer = new MutationObserver(injectCmsLayoutOverride);
    observer.observe(document.body, { childList: true, subtree: true });

    // 1. 注入預覽區通用樣式
    CMS.registerPreviewStyle(`    
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
        line-height: 1.6;
        color: #2c3e50;
        background-color: #f8f9fa;
        padding: 2rem;
      }

      /* 橫向卡片容器 */
      .card {
        background: #ffffff;
        border-radius: 12px;
        border: 1px solid #e2e8f0;
        box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
        max-width: 952px;
        margin: 0 auto;
        display: flex;
        flex-direction: row;
        overflow: hidden;
        min-height: 220px;
      }

      /* 左側封面圖片區塊 */
      .card-cover-container {
        width: 38%;
        min-width: 260px;
        flex-shrink: 0;
        display: flex;
        flex-direction: column;
        background-color: #f1f5f9;
        border-right: 1px solid #e2e8f0;
      }

      .card-cover-wrapper {
        position: relative;
        width: 100%;
        flex-grow: 1;
        min-height: 200px;
        overflow: hidden;
        cursor: grab;
        user-select: none;
      }
      .card-cover-wrapper:active {
        cursor: grabbing;
      }
      .card-cover-wrapper img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        pointer-events: none;
      }

      /* 拖曳提示標籤 */
      .drag-hint {
        position: absolute;
        top: 8px;
        right: 8px;
        background: rgba(0,0,0,0.65);
        color: white;
        padding: 3px 8px;
        border-radius: 4px;
        font-size: 11px;
        pointer-events: none;
        z-index: 10;
      }

      /* 縮放控制拉桿工具列 */
      .zoom-control-bar {
        background: #ffffff;
        padding: 6px 12px;
        display: flex;
        align-items: center;
        gap: 8px;
        border-top: 1px solid #e2e8f0;
        font-size: 12px;
        color: #64748b;
      }
      .zoom-control-bar input[type="range"] {
        flex-grow: 1;
        height: 4px;
        accent-color: #3b82f6;
        cursor: pointer;
      }

      /* 右側內容區塊 */
      .card-body {
        padding: 1.5rem 1.8rem;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        flex-grow: 1;
        width: 62%;
      }
      .card h3 {
        font-size: 1.3rem;
        color: #0f172a;
        margin-bottom: 0.8rem;
        line-height: 1.4;
        font-weight: 700;
      }
      .card .meta-info {
        margin-bottom: 0.6rem;
        font-size: 0.88rem;
        color: #64748b;
        line-height: 1.5;
      }
      .card .tags-wrapper {
        margin-bottom: 0.8rem;
      }
      .card .tag {
        display: inline-block;
        background: #eff6ff;
        color: #2563eb;
        padding: 0.25rem 0.6rem;
        border-radius: 4px;
        font-size: 0.82rem;
        font-weight: 500;
        margin-right: 0.4rem;
        margin-bottom: 0.4rem;
      }

      /* 摘要簡述左右對齊 (Justify) */
      .card p {
        color: #475569;
        font-size: 0.95rem;
        margin-bottom: 1.2rem;
        white-space: pre-line;
        word-break: break-word;
        text-align: justify;
        text-justify: inter-word;
      }

      .card a.btn {
        display: inline-block;
        align-self: flex-start;
        background: #3b82f6;
        color: #ffffff;
        padding: 0.5rem 1.2rem;
        border-radius: 6px;
        text-decoration: none;
        font-size: 0.9rem;
        font-weight: 500;
        margin-top: auto;
      }

      @media (max-width: 640px) {
        .card {
          flex-direction: column;
        }
        .card-cover-container {
          width: 100%;
        }
        .card-body {
          width: 100%;
        }
      }
    `, { raw: true });

    // 輔助工具：解析焦點數值 (0~100)
    function parseFocalValue(val) {
      if (val === undefined || val === null || val === '') return 50;
      var num = parseInt(String(val).replace(/[^0-9]/g, ''), 10);
      return isNaN(num) ? 50 : Math.min(Math.max(num, 0), 100);
    }

    // 輔助工具：抓取 YouTube ID
    function getYoutubeId(url) {
      if (!url) return null;
      var regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
      var match = String(url).match(regExp);
      return (match && match[2].length === 11) ? match[2] : null;
    }

    // 2. 通用卡片預覽組件工廠
    function createGenericPreview(collectionType) {
      return createClass({
        getInitialState: function() {
          return { 
            isDragging: false, 
            startX: 0, 
            startY: 0, 
            posX: 50, 
            posY: 50,
            zoom: 1.2
          };
        },

        handleMouseDown: function(e) {
          e.preventDefault();
          var entry = this.props.entry;
          var curX = parseFocalValue(entry.getIn(['data', 'focal_x']));
          var curY = parseFocalValue(entry.getIn(['data', 'focal_y']));

          this.setState({
            isDragging: true,
            startX: e.clientX,
            startY: e.clientY,
            posX: curX,
            posY: curY
          });
        },

        handleMouseMove: function(e) {
          if (!this.state.isDragging) return;
          var deltaX = e.clientX - this.state.startX;
          var deltaY = e.clientY - this.state.startY;

          var newX = Math.min(Math.max(this.state.posX - (deltaX * 0.3), 0), 100);
          var newY = Math.min(Math.max(this.state.posY - (deltaY * 0.3), 0), 100);

          var roundX = Math.round(newX);
          var roundY = Math.round(newY);

          this.setState({
            posX: newX,
            posY: newY,
            startX: e.clientX,
            startY: e.clientY
          });

          this.updateCmsInputs(roundX, roundY);
        },

        handleMouseUp: function() {
          if (this.state.isDragging) {
            this.setState({ isDragging: false });
            var roundX = Math.round(this.state.posX);
            var roundY = Math.round(this.state.posY);
            this.updateCmsInputs(roundX, roundY);
          }
        },

        handleZoomChange: function(e) {
          this.setState({ zoom: parseFloat(e.target.value) });
        },

        updateCmsInputs: function(x, y) {
          try {
            var inputs = window.parent.document.querySelectorAll('input[type="number"], input[id*="focal"]');
            var inputX, inputY;

            inputs.forEach(function(input) {
              var id = (input.id || '').toLowerCase();
              var name = (input.name || '').toLowerCase();
              if (id.includes('focal_x') || name.includes('focal_x') || id.endsWith('-x')) inputX = input;
              if (id.includes('focal_y') || name.includes('focal_y') || id.endsWith('-y')) inputY = input;
            });

            if (!inputX && inputs[0]) inputX = inputs[0];
            if (!inputY && inputs[1]) inputY = inputs[1];

            var setNativeValue = function(element, value) {
              var valueSetter = Object.getOwnPropertyDescriptor(element, 'value').set;
              var prototype = Object.getPrototypeOf(element);
              var prototypeValueSetter = Object.getOwnPropertyDescriptor(prototype, 'value').set;

              if (prototypeValueSetter && valueSetter !== prototypeValueSetter) {
                prototypeValueSetter.call(element, value);
              } else if (valueSetter) {
                valueSetter.call(element, value);
              } else {
                element.value = value;
              }
              element.dispatchEvent(new Event('input', { bubbles: true }));
              element.dispatchEvent(new Event('change', { bubbles: true }));
            };

            if (inputX) setNativeValue(inputX, x);
            if (inputY) setNativeValue(inputY, y);
          } catch (err) {
            console.warn('自動同步 XY 欄位時發生警告:', err);
          }
        },

        render: function() {
          var entry = this.props.entry;
          var getAsset = this.props.getAsset;

          var title = entry.getIn(['data', 'title']) || '標題名稱';
          var description = entry.getIn(['data', 'description']) || entry.getIn(['data', 'summary']) || '';
          var cover = entry.getIn(['data', 'cover']);

          var numX = this.state.isDragging ? Math.round(this.state.posX) : parseFocalValue(entry.getIn(['data', 'focal_x']));
          var numY = this.state.isDragging ? Math.round(this.state.posY) : parseFocalValue(entry.getIn(['data', 'focal_y']));
          var focalX = numX + '%';
          var focalY = numY + '%';

          var coverUrl = null;
          if (cover) {
            var coverAsset = getAsset(cover);
            coverUrl = coverAsset ? coverAsset.toString() : cover;
          } else if (collectionType === 'videos') {
            var ytUrl = entry.getIn(['data', 'youtube_url']);
            var ytId = getYoutubeId(ytUrl);
            if (ytId) coverUrl = 'https://img.youtube.com/vi/' + ytId + '/hqdefault.jpg';
          }

          var coverElement = null;
          if (coverUrl) {
            coverElement = h('div', { className: 'card-cover-container' },
              h('div', {
                className: 'card-cover-wrapper',
                onMouseDown: this.handleMouseDown,
                onMouseMove: this.handleMouseMove,
                onMouseUp: this.handleMouseUp,
                onMouseLeave: this.handleMouseUp,
                style: { cursor: this.state.isDragging ? 'grabbing' : 'grab' }
              },
                h('img', {
                  src: coverUrl,
                  style: { 
                    objectPosition: focalX + ' ' + focalY,
                    transform: 'scale(' + this.state.zoom + ')',
                    userSelect: 'none',
                    pointerEvents: 'none'
                  }
                }),
                h('span', { className: 'drag-hint' }, '拖曳焦點 (X:' + numX + ' Y:' + numY + ')')
              ),
              h('div', { className: 'zoom-control-bar' },
                h('span', {}, '🔍 縮放:'),
                h('input', {
                  type: 'range',
                  min: '1.0',
                  max: '3.0',
                  step: '0.1',
                  value: this.state.zoom,
                  onChange: this.handleZoomChange
                }),
                h('span', {}, Math.round(this.state.zoom * 100) + '%')
              )
            );
          }

          var extraContent = null;
          var buttonElement = null;

          if (collectionType === 'research') {
            var tagsRaw = entry.getIn(['data', 'tags']);
            var link = entry.getIn(['data', 'link']) || entry.getIn(['data', 'pdf_url']);
            var tagList = tagsRaw ? tagsRaw.split(/[,;]/).map(function(t) { return t.trim(); }).filter(Boolean) : [];
            
            extraContent = tagList.length > 0 && h('div', { className: 'tags-wrapper' },
              tagList.map(function(tag, i) { return h('span', { key: i, className: 'tag' }, tag); })
            );

            if (link && typeof link === 'string' && link.trim() !== '') {
              buttonElement = h('a', { href: link, target: '_blank', className: 'btn' }, '查看論文/連結');
            }
          } else if (collectionType === 'videos') {
            var youtubeUrl = entry.getIn(['data', 'youtube_url']);
            if (youtubeUrl) {
              buttonElement = h('a', { href: youtubeUrl, target: '_blank', className: 'btn' }, '觀看影片');
            }
          } else if (collectionType === 'plans') {
            var role = entry.getIn(['data', 'role']) || '-';
            var period = entry.getIn(['data', 'period']) || '-';
            extraContent = h('div', { className: 'meta-info' },
              h('div', {}, '角色：' + role),
              h('div', {}, '時間：' + period)
            );
          } else if (collectionType === 'competitions') {
            var award = entry.getIn(['data', 'award']) || entry.getIn(['data', 'role']) || '-';
            var compPeriod = entry.getIn(['data', 'period']) || entry.getIn(['data', 'date']) || '-';
            extraContent = h('div', { className: 'meta-info' },
              h('div', {}, '獎項：' + award),
              h('div', {}, '時間：' + compPeriod)
            );
          }

          return h('div', { className: 'card' },
            coverElement,
            h('div', { className: 'card-body' },
              h('div', {},
                h('h3', {}, title),
                extraContent,
                h('p', {}, description)
              ),
              buttonElement
            )
          );
        }
      });
    }

    // 3. 註冊 Templates
    CMS.registerPreviewTemplate('research', createGenericPreview('research'));
    CMS.registerPreviewTemplate('videos', createGenericPreview('videos'));
    CMS.registerPreviewTemplate('plans', createGenericPreview('plans'));
    CMS.registerPreviewTemplate('competitions', createGenericPreview('competitions'));
  </script>
</body>
</html>
