<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>後台內容管理系統</title>
  
  <style>
    
    /* 1. 最外層主容器：無邊框、純橫向 Flex 排列 */
    div[class*="-ControlContainer"]:has(div[class*="ImageWrapper"]) {
      display: flex !important;
      flex-direction: row !important;
      align-items: flex-start !important;
      justify-content: flex-start !important;
      gap: 16px !important;
      width: 100% !important;
      padding: 0 !important;
      margin-bottom: 20px !important;
      border: none !important;
      border-radius: 0 !important;
      background: transparent !important;
      box-shadow: none !important;
      outline: none !important;
    }
    
    /* 3. 【核心修正】左側「封面圖片」區塊：改為標準 CMS 的標籤外框樣式 */
    .css-83wr9v {
      display: block;
      width: 100%;
      padding: 16px 20px;
      margin: 0px;
      border: 2px solid rgb(223, 223, 227);
      border-radius: 0px 5px 5px;
      outline: 0px;
      box-shadow: none;
      background-color: rgb(255, 255, 255);
      color: rgb(68, 74, 87);
      transition: border-color 0.2s;
      position: relative;
      font-size: 15px;
      line-height: 1.5;
    }
    .image-field-left-group {
      display: flex !important;
      flex-direction: row !important;
      align-items: center !important;
      gap: 20px !important;
      flex-grow: 1 !important;
      
      /* 外框樣式：對齊第二張圖 */
      border-radius: 0 6px 6px 6px !important; /* 左上角直角，其餘圓角 */
      background-color: #ffffff !important;     
      position: relative !important;
      box-sizing: border-box !important;      
    }
    
    /* 4. 圖片縮圖外框固定尺寸 */
    div[class*="ImageWrapper"] {
      width: 120px !important;
      min-width: 120px !important;
      height: 120px !important;
      margin: 0 !important;
      flex-shrink: 0 !important;
      border: 1px solid #cbd5e1 !important;
      border-radius: 6px !important;
      overflow: hidden !important;
    }

    div[class*="ImageWrapper"] img {
      width: 100% !important;
      height: 100% !important;
      object-fit: cover !important;
    }

    /* 5. 圖片右側按鈕容器 */
    .moved-btn-group {
      display: flex !important;
      flex-direction: column !important;
      justify-content: center !important;
      align-items: flex-start !important;
      gap: 8px !important;
      margin: 0 !important;
      padding: 0 !important;
      border: none !important;
      width: auto !important;
    }

    .moved-btn-group button,
    .moved-btn-group a,
    .moved-btn-group span {
      margin: 0 !important;
      width: 150px !important;
      white-space: nowrap !important;
      display: inline-block !important;
      text-align: center !important;
    }

    /* 6. 右側 X/Y 軸獨立欄位容器 */
    .focal-inputs-column {
      display: flex !important;
      flex-direction: column !important;
      gap: 12px !important;
      flex-shrink: 0 !important;
      margin-top: 24px !important; /* 與左側對齊頂部 */
    }

    .moved-focal-box {
      display: flex !important;
      flex-direction: column !important;
      width: 150px !important;
      min-width: 150px !important;
      margin: 0 !important;
      padding: 12px 14px !important;
      border: 1px solid #cbd5e1 !important;
      border-radius: 8px !important;
      background-color: #ffffff !important;
      box-sizing: border-box !important;
      position: relative !important;
    }

    .moved-focal-box [class*="ControlTopbar"],
    .moved-focal-box label {
      display: block !important;
      font-size: 12px !important;
      font-weight: 600 !important;
      white-space: nowrap !important;
      color: #475569 !important;
      margin-bottom: 6px !important;
      padding: 0 !important;
    }

    .moved-focal-box input {
      display: block !important;
      width: 100% !important;
      height: 34px !important;
      padding: 2px 8px !important;
      font-size: 13px !important;
      border: 1px solid #cbd5e1 !important;
      border-radius: 4px !important;
      box-sizing: border-box !important;
      background: #ffffff !important;
    }
  </style>
</head>
<body>
  <!-- 載入 Decap CMS -->
  <script src="https://cdn.jsdelivr.net/npm/decap-cms@^3.0.0/dist/decap-cms.js"></script>

  <script>
    function fixFocalLayout() {
      try {
        const imgWrapper = document.querySelector('div[class*="ImageWrapper"]');
        if (!imgWrapper) return;

        const mainContainer = imgWrapper.closest('div[class*="-ControlContainer"]');
        if (!mainContainer) return;

        // 1. 設定左側欄位容器
        const outerBox = imgWrapper.parentElement;
        if (outerBox && !outerBox.classList.contains('image-field-left-group')) {
          outerBox.classList.add('image-field-left-group');
        }

        // 2. 尋找按鈕組並搬移到圖片右邊
        const btnGroup = imgWrapper.nextElementSibling;
        if (btnGroup && !btnGroup.classList.contains('moved-btn-group')) {
          btnGroup.classList.add('moved-btn-group');
          if (imgWrapper.parentElement) {
            imgWrapper.parentElement.appendChild(btnGroup);
          }
        }

        // 3. 建立右側專用 Column 容器
        let rightColumn = mainContainer.querySelector('.focal-inputs-column');
        if (!rightColumn) {
          rightColumn = document.createElement('div');
          rightColumn.className = 'focal-inputs-column';
          mainContainer.appendChild(rightColumn);
        }

        // 4. 尋找 X 軸與 Y 軸並移入右側 Column
        const allContainers = Array.from(document.querySelectorAll('div[class*="ControlContainer"]'));
        let xBox = null;
        let yBox = null;

        allContainers.forEach(container => {
          if (container === mainContainer) return;
          const text = container.innerText || '';
          if (text.includes('X軸')) xBox = container;
          if (text.includes('Y軸')) yBox = container;
        });

        if (xBox && xBox.parentElement !== rightColumn) {
          xBox.classList.add('moved-focal-box');
          rightColumn.appendChild(xBox);
        }
        if (yBox && yBox.parentElement !== rightColumn) {
          yBox.classList.add('moved-focal-box');
          rightColumn.appendChild(yBox);
        }

        if (xBox && yBox && xBox.nextElementSibling !== yBox) {
          rightColumn.appendChild(xBox);
          rightColumn.appendChild(yBox);
        }
      } catch (e) {
        console.warn('佈局調整監聽中:', e);
      }
    }

    // 動態監聽，解決 React 畫面重繪問題
    setInterval(fixFocalLayout, 200);

    // 註冊右側預覽頁面樣式
    CMS.registerPreviewStyle(`    
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
        line-height: 1.6;
        color: #2c3e50;
        background-color: #f8f9fa;
        padding: 2rem;
      }
      .card {
        background: #ffffff;
        border-radius: 12px;
        border: 1px solid #e2e8f0;
        box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
        max-width: 952px;
        margin: 0 auto;
        display: flex;
        flex-direction: row;
        overflow: hidden;
        min-height: 220px;
      }
      .card-cover-container {
        width: 38%;
        min-width: 260px;
        flex-shrink: 0;
        display: flex;
        flex-direction: column;
        background-color: #f1f5f9;
        border-right: 1px solid #e2e8f0;
      }
      .card-cover-wrapper {
        position: relative;
        width: 100%;
        flex-grow: 1;
        min-height: 200px;
        overflow: hidden;
        cursor: grab;
        user-select: none;
      }
      .card-cover-wrapper:active { cursor: grabbing; }
      .card-cover-wrapper img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        pointer-events: none;
      }
      .drag-hint {
        position: absolute;
        top: 8px;
        right: 8px;
        background: rgba(0,0,0,0.65);
        color: white;
        padding: 3px 8px;
        border-radius: 4px;
        font-size: 11px;
        pointer-events: none;
        z-index: 10;
      }
      .zoom-control-bar {
        background: #ffffff;
        padding: 6px 12px;
        display: flex;
        align-items: center;
        gap: 8px;
        border-top: 1px solid #e2e8f0;
        font-size: 12px;
        color: #64748b;
      }
      .zoom-control-bar input[type="range"] {
        flex-grow: 1;
        height: 4px;
        accent-color: #3b82f6;
        cursor: pointer;
      }
      .card-body {
        padding: 1.5rem 1.8rem;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        flex-grow: 1;
        width: 62%;
      }
      .card h3 {
        font-size: 1.3rem;
        color: #0f172a;
        margin-bottom: 0.8rem;
        line-height: 1.4;
        font-weight: 700;
      }
      .card .meta-info {
        margin-bottom: 0.6rem;
        font-size: 0.88rem;
        color: #64748b;
        line-height: 1.5;
      }
      .card .tags-wrapper { margin-bottom: 0.8rem; }
      .card .tag {
        display: inline-block;
        background: #eff6ff;
        color: #2563eb;
        padding: 0.25rem 0.6rem;
        border-radius: 4px;
        font-size: 0.82rem;
        font-weight: 500;
        margin-right: 0.4rem;
        margin-bottom: 0.4rem;
      }
      .card p {
        color: #475569;
        font-size: 0.95rem;
        margin-bottom: 1.2rem;
        white-space: pre-line;
        word-break: break-word;
        text-align: justify;
        text-justify: inter-word;
      }
      .card a.btn {
        display: inline-block;
        align-self: flex-start;
        background: #3b82f6;
        color: #ffffff;
        padding: 0.5rem 1.2rem;
        border-radius: 6px;
        text-decoration: none;
        font-size: 0.9rem;
        font-weight: 500;
        margin-top: auto;
      }
    `, { raw: true });

    function parseFocalValue(val) {
      if (val === undefined || val === null || val === '') return 50;
      var num = parseInt(String(val).replace(/[^0-9]/g, ''), 10);
      return isNaN(num) ? 50 : Math.min(Math.max(num, 0), 100);
    }

    function getYoutubeId(url) {
      if (!url) return null;
      var regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
      var match = String(url).match(regExp);
      return (match && match[2].length === 11) ? match[2] : null;
    }

    function createGenericPreview(collectionType) {
      return createClass({
        getInitialState: function() {
          return { isDragging: false, startX: 0, startY: 0, posX: 50, posY: 50, zoom: 1.2 };
        },
        handleMouseDown: function(e) {
          e.preventDefault();
          var entry = this.props.entry;
          var curX = parseFocalValue(entry.getIn(['data', 'focal_x']));
          var curY = parseFocalValue(entry.getIn(['data', 'focal_y']));
          this.setState({ isDragging: true, startX: e.clientX, startY: e.clientY, posX: curX, posY: curY });
        },
        handleMouseMove: function(e) {
          if (!this.state.isDragging) return;
          var deltaX = e.clientX - this.state.startX;
          var deltaY = e.clientY - this.state.startY;
          var newX = Math.min(Math.max(this.state.posX - (deltaX * 0.3), 0), 100);
          var newY = Math.min(Math.max(this.state.posY - (deltaY * 0.3), 0), 100);
          var roundX = Math.round(newX);
          var roundY = Math.round(newY);
          this.setState({ posX: newX, posY: newY, startX: e.clientX, startY: e.clientY });
          this.updateCmsInputs(roundX, roundY);
        },
        handleMouseUp: function() {
          if (this.state.isDragging) {
            this.setState({ isDragging: false });
            this.updateCmsInputs(Math.round(this.state.posX), Math.round(this.state.posY));
          }
        },
        handleZoomChange: function(e) {
          this.setState({ zoom: parseFloat(e.target.value) });
        },
        updateCmsInputs: function(x, y) {
          try {
            var inputs = window.parent.document.querySelectorAll('input[type="number"], input[id*="focal"]');
            var inputX, inputY;
            inputs.forEach(function(input) {
              var id = (input.id || '').toLowerCase();
              var name = (input.name || '').toLowerCase();
              if (id.includes('focal_x') || name.includes('focal_x') || id.endsWith('-x')) inputX = input;
              if (id.includes('focal_y') || name.includes('focal_y') || id.endsWith('-y')) inputY = input;
            });
            if (!inputX && inputs[0]) inputX = inputs[0];
            if (!inputY && inputs[1]) inputY = inputs[1];

            var setNativeValue = function(element, value) {
              var valueSetter = Object.getOwnPropertyDescriptor(element, 'value').set;
              var prototype = Object.getPrototypeOf(element);
              var prototypeValueSetter = Object.getOwnPropertyDescriptor(prototype, 'value').set;
              if (prototypeValueSetter && valueSetter !== prototypeValueSetter) {
                prototypeValueSetter.call(element, value);
              } else if (valueSetter) {
                valueSetter.call(element, value);
              } else {
                element.value = value;
              }
              element.dispatchEvent(new Event('input', { bubbles: true }));
              element.dispatchEvent(new Event('change', { bubbles: true }));
            };

            if (inputX) setNativeValue(inputX, x);
            if (inputY) setNativeValue(inputY, y);
          } catch (err) {
            console.warn('自動同步欄位提醒:', err);
          }
        },
        render: function() {
          var entry = this.props.entry;
          var getAsset = this.props.getAsset;
          var title = entry.getIn(['data', 'title']) || '標題名稱';
          var description = entry.getIn(['data', 'description']) || entry.getIn(['data', 'summary']) || '';
          var cover = entry.getIn(['data', 'cover']);

          var numX = this.state.isDragging ? Math.round(this.state.posX) : parseFocalValue(entry.getIn(['data', 'focal_x']));
          var numY = this.state.isDragging ? Math.round(this.state.posY) : parseFocalValue(entry.getIn(['data', 'focal_y']));

          var coverUrl = null;
          if (cover) {
            var coverAsset = getAsset(cover);
            coverUrl = coverAsset ? coverAsset.toString() : cover;
          } else if (collectionType === 'videos') {
            var ytUrl = entry.getIn(['data', 'youtube_url']);
            var ytId = getYoutubeId(ytUrl);
            if (ytId) coverUrl = 'https://img.youtube.com/vi/' + ytId + '/hqdefault.jpg';
          }

          var coverElement = null;
          if (coverUrl) {
            coverElement = h('div', { className: 'card-cover-container' },
              h('div', {
                className: 'card-cover-wrapper',
                onMouseDown: this.handleMouseDown,
                onMouseMove: this.handleMouseMove,
                onMouseUp: this.handleMouseUp,
                onMouseLeave: this.handleMouseUp,
                style: { cursor: this.state.isDragging ? 'grabbing' : 'grab' }
              },
                h('img', {
                  src: coverUrl,
                  style: { 
                    objectPosition: numX + '% ' + numY + '%',
                    transform: 'scale(' + this.state.zoom + ')',
                    userSelect: 'none',
                    pointerEvents: 'none'
                  }
                }),
                h('span', { className: 'drag-hint' }, '拖曳焦點 (X:' + numX + ' Y:' + numY + ')')
              ),
              h('div', { className: 'zoom-control-bar' },
                h('span', {}, '🔍 縮放:'),
                h('input', {
                  type: 'range',
                  min: '1.0',
                  max: '3.0',
                  step: '0.1',
                  value: this.state.zoom,
                  onChange: this.handleZoomChange
                }),
                h('span', {}, Math.round(this.state.zoom * 100) + '%')
              )
            );
          }

          var extraContent = null;
          var buttonElement = null;

          if (collectionType === 'research') {
            var tagsRaw = entry.getIn(['data', 'tags']);
            var link = entry.getIn(['data', 'link']) || entry.getIn(['data', 'pdf_url']);
            var tagList = tagsRaw ? tagsRaw.split(/[,;]/).map(function(t) { return t.trim(); }).filter(Boolean) : [];
            extraContent = tagList.length > 0 && h('div', { className: 'tags-wrapper' },
              tagList.map(function(tag, i) { return h('span', { key: i, className: 'tag' }, tag); })
            );
            if (link && typeof link === 'string' && link.trim() !== '') {
              buttonElement = h('a', { href: link, target: '_blank', className: 'btn' }, '查看論文/連結');
            }
          } else if (collectionType === 'videos') {
            var youtubeUrl = entry.getIn(['data', 'youtube_url']);
            if (youtubeUrl) {
              buttonElement = h('a', { href: youtubeUrl, target: '_blank', className: 'btn' }, '觀看影片');
            }
          } else if (collectionType === 'plans') {
            var role = entry.getIn(['data', 'role']) || '-';
            var period = entry.getIn(['data', 'period']) || '-';
            extraContent = h('div', { className: 'meta-info' },
              h('div', {}, '角色：' + role),
              h('div', {}, '時間：' + period)
            );
          } else if (collectionType === 'competitions') {
            var award = entry.getIn(['data', 'award']) || entry.getIn(['data', 'role']) || '-';
            var compPeriod = entry.getIn(['data', 'period']) || entry.getIn(['data', 'date']) || '-';
            extraContent = h('div', { className: 'meta-info' },
              h('div', {}, '獎項：' + award),
              h('div', {}, '時間：' + compPeriod)
            );
          }

          return h('div', { className: 'card' },
            coverElement,
            h('div', { className: 'card-body' },
              h('div', {},
                h('h3', {}, title),
                extraContent,
                h('p', {}, description)
              ),
              buttonElement
            )
          );
        }
      });
    }

    CMS.registerPreviewTemplate('research', createGenericPreview('research'));
    CMS.registerPreviewTemplate('videos', createGenericPreview('videos'));
    CMS.registerPreviewTemplate('plans', createGenericPreview('plans'));
    CMS.registerPreviewTemplate('competitions', createGenericPreview('competitions'));
  </script>
</body>
</html>
