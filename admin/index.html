<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>後台內容管理系統</title>
</head>
<body>
  <!-- 載入 Decap CMS -->
  <script src="https://cdn.jsdelivr.net/npm/decap-cms@^3.0.0/dist/decap-cms.js"></script>
  
  <script>
    // 1. 注入與前台 1:1 還原的 CSS 樣式
    CMS.registerPreviewStyle(`    
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        line-height: 1.6;
        color: #2c3e50;
        background-color: #f8f9fa;
        padding: 2rem;
      }

      /* 前台卡片視覺設定 */
      .card {
        background: #ffffff;
        border-radius: 12px;
        border: 1px solid #e2e8f0;
        box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.05);
        max-width: 380px;
        margin: 0 auto;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        overflow: hidden;
      }

      /* 封面圖可拖拽挪動樣式 (16:9) */
      .card-cover-wrapper {
        position: relative;
        width: 100%;
        aspect-ratio: 16 / 9;
        overflow: hidden;
        background-color: #f1f5f9;
        cursor: grab;
        user-select: none;
      }
      .card-cover-wrapper:active {
        cursor: grabbing;
      }
      .card-cover-wrapper img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        pointer-events: none;
      }
      .drag-hint {
        position: absolute;
        bottom: 8px;
        right: 8px;
        background: rgba(0,0,0,0.6);
        color: white;
        padding: 2px 8px;
        border-radius: 4px;
        font-size: 11px;
        pointer-events: none;
      }

      .card-body {
        padding: 1.5rem;
        display: flex;
        flex-direction: column;
        flex-grow: 1;
      }

      .card h3 {
        font-size: 1.25rem;
        color: #0f172a;
        margin-bottom: 0.8rem;
        line-height: 1.4;
        font-weight: 700;
      }
      .card .tags-wrapper {
        margin-bottom: 0.8rem;
      }
      .card .tag {
        display: inline-block;
        background: #eff6ff;
        color: #2563eb;
        padding: 0.25rem 0.65rem;
        border-radius: 6px;
        font-size: 0.82rem;
        font-weight: 500;
        margin-right: 0.4rem;
        margin-bottom: 0.4rem;
      }
      .card p {
        color: #475569;
        font-size: 0.95rem;
        margin-bottom: 1.2rem;
        white-space: pre-line;
        word-break: break-all;
      }
      .card a.btn {
        display: inline-block;
        text-align: center;
        background: #3b82f6;
        color: #ffffff;
        padding: 0.5rem 1rem;
        border-radius: 6px;
        text-decoration: none;
        font-size: 0.9rem;
        font-weight: 500;
        margin-top: auto;
      }
    `, { raw: true });

    // 2. 註冊研究成果 (research) 的自訂預覽範本（全方向拖曳與輸入框同步修復版）
    var ResearchPreview = createClass({
      getInitialState: function() {
        return { 
          isDragging: false, 
          startX: 0, 
          startY: 0, 
          currentPosX: null, 
          currentPosY: null 
        };
      },

      // 解析數值字串 (例如 "45%" -> 45)
      parsePercent: function(val, defaultVal) {
        if (!val) return defaultVal;
        var parsed = parseInt(val, 10);
        return isNaN(parsed) ? defaultVal : parsed;
      },

      handleMouseDown: function(e) {
        var entry = this.props.entry;
        
        // 按下點擊時，優先從後台欄位抓取現有百分比，若無則預設為 50
        var rawX = entry.getIn(['data', 'focal_x']);
        var rawY = entry.getIn(['data', 'focal_y']);
        
        var initX = this.state.currentPosX !== null ? this.state.currentPosX : this.parsePercent(rawX, 50);
        var initY = this.state.currentPosY !== null ? this.state.currentPosY : this.parsePercent(rawY, 50);

        this.setState({
          isDragging: true,
          startX: e.clientX,
          startY: e.clientY,
          currentPosX: initX,
          currentPosY: initY
        });
      },

      handleMouseMove: function(e) {
        if (!this.state.isDragging) return;
        
        var deltaX = e.clientX - this.state.startX;
        var deltaY = e.clientY - this.state.startY;

        // 計算 X 與 Y 軸新位置（限制在 0% ~ 100% 之間）
        var newPosX = Math.min(Math.max(this.state.currentPosX - (deltaX * 0.3), 0), 100);
        var newPosY = Math.min(Math.max(this.state.currentPosY - (deltaY * 0.3), 0), 100);
        
        this.setState({
          currentPosX: newPosX,
          currentPosY: newPosY,
          startX: e.clientX,
          startY: e.clientY
        });

        // 強制更新資料並觸發 React 狀態同步回左側輸入框
        if (this.props.onChange) {
          var data = this.props.entry.get('data');
          var updatedData = data
            .set('focal_x', Math.round(newPosX) + '%')
            .set('focal_y', Math.round(newPosY) + '%');
          
          this.props.onChange(updatedData);
        }
      },

      handleMouseUp: function() {
        this.setState({ isDragging: false });
      },

      render: function() {
        var entry = this.props.entry;
        var getAsset = this.props.getAsset;
        
        var title = entry.getIn(['data', 'title']) || '我是研究標題';
        var tagsRaw = entry.getIn(['data', 'tags']);
        var description = entry.getIn(['data', 'description']) || entry.getIn(['data', 'summary']) || '';
        var link = entry.getIn(['data', 'link']) || entry.getIn(['data', 'pdf_url']);
        var cover = entry.getIn(['data', 'cover']);

        // 欄位值讀取邏輯
        var rawFocalX = entry.getIn(['data', 'focal_x']);
        var rawFocalY = entry.getIn(['data', 'focal_y']);

        // 如果拖曳中以 state 為主，否則讀取輸入框/資料檔案中的數值
        var focalX = (this.state.isDragging || this.state.currentPosX !== null) 
          ? Math.round(this.state.currentPosX) + '%' 
          : (rawFocalX || '50%');

        var focalY = (this.state.isDragging || this.state.currentPosY !== null) 
          ? Math.round(this.state.currentPosY) + '%' 
          : (rawFocalY || '50%');

        // 將逗號分隔的標籤轉為陣列
        var tagList = [];
        if (tagsRaw) {
          tagList = tagsRaw.split(/[,;]/).map(function(t) { return t.trim(); }).filter(Boolean);
        }

        // 嚴格網址格式判斷 (必須包含完整 http:// 或 https://)
        var hasLink = false;
        if (link && typeof link === 'string') {
          var cleanLink = link.trim();
          var urlPattern = /^(https?:\/\/)[^\s/$.?#].[^\s]*$/i;
          hasLink = urlPattern.test(cleanLink);
        }

        // 安全解析封面圖片 Blob / URL
        var coverElement = null;
        if (cover) {
          var coverAsset = getAsset(cover);
          var coverUrl = coverAsset ? coverAsset.toString() : cover;

          coverElement = h('div', {
            className: 'card-cover-wrapper',
            onMouseDown: this.handleMouseDown,
            onMouseMove: this.handleMouseMove,
            onMouseUp: this.handleMouseUp,
            onMouseLeave: this.handleMouseUp
          },
            h('img', {
              src: coverUrl,
              style: { 
                objectPosition: focalX + ' ' + focalY,
                transform: 'scale(1.2)' // 微放大 1.2 倍，確保左右挪動時不會露白
              }
            }),
            h('span', { className: 'drag-hint' }, '✢ 按住拖曳挪動焦點')
          );
        }

        return h('div', { className: 'card' },
          coverElement,
          h('div', { className: 'card-body' },
            h('div', {},
              h('h3', {}, title),
              tagList.length > 0 && h('div', { className: 'tags-wrapper' },
                tagList.map(function(tag, i) {
                  return h('span', { key: i, className: 'tag' }, tag);
                })
              ),
              h('p', {}, description)
            ),
            hasLink && h('a', { href: link, target: '_blank', className: 'btn' }, '查看論文/連結')
          )
        );
      }
    });

    // 3. 強制註冊範本到 research 集合
    CMS.registerPreviewTemplate('research', ResearchPreview);
  </script>
</body>
</html>
