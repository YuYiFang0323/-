<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>後台內容管理系統</title>  
</head>
<body>
  <!-- 載入 Decap CMS -->
  <script src="https://cdn.jsdelivr.net/npm/decap-cms@^3.0.0/dist/decap-cms.js"></script>
  
  <script>
    // 1. 直接套用跟前台 100% 一模一樣的 CSS 樣式
    CMS.registerPreviewStyle(`
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        line-height: 1.6;
        color: #2c3e50;
        background-color: #f8f9fa;
        padding: 2rem;
      }

      /* 前台卡片核心樣式 */
      .card {
        background: #ffffff;
        border-radius: 10px;
        padding: 1.8rem;
        border: 1px solid #e2e8f0;
        box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
        max-width: 400px;
        margin: 0 auto;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        min-height: 200px;
      }
      .card h3 {
        font-size: 1.25rem;
        color: #0f172a;
        margin-bottom: 0.8rem;
        line-height: 1.4;
        font-weight: 700;
      }
      .card .tags-wrapper {
        margin-bottom: 0.8rem;
      }
      .card .tag {
        display: inline-block;
        background: #eff6ff;
        color: #2563eb;
        padding: 0.25rem 0.6rem;
        border-radius: 4px;
        font-size: 0.82rem;
        font-weight: 500;
        margin-right: 0.4rem;
        margin-bottom: 0.4rem;
      }
      .card p {
        color: #475569;
        font-size: 0.95rem;
        margin-bottom: 1.2rem;
        white-space: pre-line;
        word-break: break-all;
      }
      .card a.btn {
        display: inline-block;
        text-align: center;
        background: #3b82f6;
        color: #ffffff;
        padding: 0.5rem 1rem;
        border-radius: 6px;
        text-decoration: none;
        font-size: 0.9rem;
        font-weight: 500;
        margin-top: auto;
      }
    `, { raw: true });

    // 2. 研究成果 (research) 預覽範本 (100% 複製前台 renderResearch 邏輯)
    var ResearchPreview = createClass({
      render: function() {
        var entry = this.props.entry;
        var title = entry.getIn(['data', 'title']) || '無標題';
        var tagsRaw = entry.getIn(['data', 'tags']);
        var description = entry.getIn(['data', 'description']) || '';
        var link = entry.getIn(['data', 'link']);

        // 處理標籤
        var tagList = [];
        if (tagsRaw) {
          tagList = tagsRaw.split(/[,;]/).map(function(t) { return t.trim(); }).filter(Boolean);
        }

        // 判斷是否顯示按鈕
        var hasLink = link && link !== '000000' && link.trim() !== '';

        return h('div', { className: 'card' },
          h('div', {},
            h('h3', {}, title),
            tagList.length > 0 && h('div', { className: 'tags-wrapper' },
              tagList.map(function(tag, i) {
                return h('span', { key: i, className: 'tag' }, tag);
              })
            ),
            h('p', {}, description)
          ),
          hasLink && h('a', { href: link, target: '_blank', className: 'btn' }, '查看論文/連結')
        );
      }
    });

    // 3. 影音作品 (videos) 預覽範本
    var VideoPreview = createClass({
      render: function() {
        var entry = this.props.entry;
        var title = entry.getIn(['data', 'title']) || '無標題';
        var description = entry.getIn(['data', 'description']) || '';
        var youtubeUrl = entry.getIn(['data', 'youtube_url']);

        return h('div', { className: 'card' },
          h('div', {},
            h('h3', {}, title),
            h('p', {}, description)
          ),
          youtubeUrl && h('a', { href: youtubeUrl, target: '_blank', className: 'btn' }, '觀看影片')
        );
      }
    });

    // 4. 計畫/競賽 (plans / competitions) 預覽範本
    var ProjectPreview = createClass({
      render: function() {
        var entry = this.props.entry;
        var title = entry.getIn(['data', 'title']) || '無標題';
        var role = entry.getIn(['data', 'role']) || '-';
        var period = entry.getIn(['data', 'period']) || '-';
        var description = entry.getIn(['data', 'description']) || '';

        return h('div', { className: 'card' },
          h('div', {},
            h('h3', {}, title),
            h('p', { style: { marginBottom: '0.5rem', fontSize: '0.88rem', color: '#64748b' } },
              h('strong', {}, '角色：'), role, h('br'),
              h('strong', {}, '時間：'), period
            ),
            h('p', {}, description)
          )
        );
      }
    });

    // 5. 註冊至各自的 Collection
    CMS.registerPreviewTemplate('research', ResearchPreview);
    CMS.registerPreviewTemplate('videos', VideoPreview);
    CMS.registerPreviewTemplate('plans', ProjectPreview);
    CMS.registerPreviewTemplate('competitions', ProjectPreview);
  </script>
</body>
</html>
