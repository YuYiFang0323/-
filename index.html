<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>個人作品集 Portfolio</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      line-height: 1.6;
      color: #2c3e50;
      background-color: #f8f9fa;
    }

    /* 頂部導覽列 */
    header {
      background: #ffffff;
      border-bottom: 1px solid #e9ecef;
      position: sticky;
      top: 0;
      z-index: 1000;
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
    }
    nav {
      max-width: 952px; /* 寬度對齊 952px */
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1.2rem 2rem;
    }
    .logo {
      font-size: 1.3rem;
      font-weight: 700;
      color: #1a252f;
      text-decoration: none;
    }
    .nav-links {
      display: flex;
      gap: 1.8rem;
      list-style: none;
    }
    .nav-links a {
      color: #495057;
      text-decoration: none;
      font-weight: 500;
      transition: color 0.2s;
    }
    .nav-links a:hover {
      color: #3b82f6;
    }

    /* 主要內容區域：改為 952px 寬度 */
    .container {
      max-width: 952px;
      margin: 0 auto;
      padding: 3rem 1.5rem;
    }

    /* 各區塊標題設計 */
    section {
      margin-bottom: 4rem;
      text-align: center;
    }
    section h2 {
      font-size: 2rem;
      color: #1e293b;
      margin-bottom: 0.5rem;
      display: inline-block;
      position: relative;
    }
    section h2::after {
      content: '';
      display: block;
      width: 45px;
      height: 4px;
      background: #3b82f6;
      margin: 8px auto 0 auto;
      border-radius: 2px;
    }

    /* 橫向卡片容器（單欄） */
    .grid {
      display: flex;
      flex-direction: column;
      gap: 1.8rem;
      margin-top: 2rem;
      text-align: left;
    }

    /* 橫向長方形卡片 */
    .card {
      background: #ffffff;
      border-radius: 12px;
      border: 1px solid #e2e8f0;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
      transition: transform 0.2s, box-shadow 0.2s;
      display: flex;
      flex-direction: row; /* 關鍵：改為左右橫向 */
      overflow: hidden;
      height: 350px; /* 卡片舒適高度 */
    }
    .card:hover {
      transform: translateY(-4px);
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
    }

    /* 左側封面圖片區塊 (佔約 38% 寬度) */
    .card-cover-wrapper {
      width: 38%;
      min-width: 260px;
      flex-shrink: 0;
      background-color: #f1f5f9;
      overflow: hidden;
      position: relative;
    }

    .card-cover {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* 右側內容區塊 */
    .card-body {
      padding: 1.5rem 1.8rem;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      flex-grow: 1;
      width: 62%;
    }

    .card h3 {
      font-size: 1.3rem;
      color: #0f172a;
      margin-bottom: 0.8rem;
      line-height: 1.4;
      display: -webkit-box;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 2; /* 限制顯示的行數，例如 2 行 */
      overflow: hidden;
    }
    .card .tags-wrapper {
      margin-bottom: 0.8rem;
    }
    .card .tag {
      display: inline-block;
      background: #eff6ff;
      color: #2563eb;
      padding: 0.25rem 0.6rem;
      border-radius: 4px;
      font-size: 0.82rem;
      font-weight: 500;
      margin-right: 0.4rem;
      margin-bottom: 0.4rem;
    }
    .card p {
      color: #475569;
      font-size: 0.95rem;
      margin-bottom: 0.8rem;     
      word-break: break-all;
      display: -webkit-box;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 5; /* 限制顯示的行數，例如 5 行 */
      overflow: hidden;
    }
    .card a.btn {
      display: inline-block;
      align-self: flex-start; /* 按鈕靠左下 */
      background: #3b82f6;
      color: #ffffff;
      padding: 0.5rem 1.2rem;
      border-radius: 6px;
      text-decoration: none;
      font-size: 0.9rem;
      font-weight: 500;
      transition: background 0.2s;
      margin-top: auto;
    }
    .card a.btn:hover {
      background: #2563eb;
    }

    .empty-msg {
      text-align: center;
      color: #94a3b8;
      font-size: 1rem;
      padding: 2rem 0;
    }

    /* 手機版 (寬度 < 640px) 自動轉回豎向，確保不會壓縮 */
    @media (max-width: 640px) {
      .card {
        flex-direction: column;
      }
      .card-cover-wrapper {
        width: 100%;
        height: 200px;
      }
      .card-body {
        width: 100%;
      }
    }
  </style>
</head>
<body>

  <header>
    <nav>
      <a href="#" class="logo">My Portfolio</a>
      <ul class="nav-links">
        <li><a href="#research">研究成果</a></li>
        <li><a href="#videos">影音作品</a></li>
        <li><a href="#plans">計畫作品</a></li>
        <li><a href="#competitions">競賽獲獎</a></li>
      </ul>
    </nav>
  </header>

  <div class="container">
    <section id="research">
      <h2>研究成果</h2>
      <div id="research-list" class="grid"><p class="empty-msg">正在載入資料...</p></div>
    </section>

    <section id="videos">
      <h2>影音作品</h2>
      <div id="videos-list" class="grid"><p class="empty-msg">正在載入資料...</p></div>
    </section>

    <section id="plans">
      <h2>計畫作品</h2>
      <div id="plans-list" class="grid"><p class="empty-msg">正在載入資料...</p></div>
    </section>

    <section id="competitions">
      <h2>競賽獲獎</h2>
      <div id="competitions-list" class="grid"><p class="empty-msg">正在載入資料...</p></div>
    </section>
  </div>

  <script>
    const USERNAME = "YuYiFang0323"; 
    const REPO = "MyWeb"; 
    const BRANCH = "main";

    // 取得 YouTube ID 的輔助函數
    function getYoutubeId(url) {
      if (!url) return null;
      const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
      const match = url.match(regExp);
      return (match && match[2].length === 11) ? match[2] : null;
    }

    // 轉譯圖片網址
    function getImageUrl(path) {
      if (!path) return '';
      
      let cleanPath = String(path).trim().replace(/^['"]|['"]$/g, '');

      if (cleanPath.startsWith('http://') || cleanPath.startsWith('https://') || cleanPath.startsWith('blob:')) {
        return cleanPath;
      }

      cleanPath = cleanPath.replace(/^\//, '').replace(/^public\//, '');

      if (cleanPath.startsWith('assets/') || cleanPath.startsWith('static/')) {
        return `https://raw.githubusercontent.com/${USERNAME}/${REPO}/${BRANCH}/${cleanPath}`;
      }

      return `https://raw.githubusercontent.com/${USERNAME}/${REPO}/${BRANCH}/static/${cleanPath}`;
    }

    // 格式化 XY 焦點數值
    function formatFocal(val) {
      if (val === undefined || val === null || val === '') return '50%';
      let strVal = String(val).trim();
      if (!strVal.endsWith('%')) {
        strVal += '%';
      }
      return strVal;
    }

    // Front Matter 解析器
    function parseFrontMatter(text) {
      const match = text.match(/^---\r?\n([\s\S]*?)\r?\n---/);
      if (!match) return { description: text };
      const yamlText = match[1];
      const data = {};
      
      yamlText.split('\n').forEach(line => {
        const colonIndex = line.indexOf(':');
        if (colonIndex !== -1) {
          const key = line.slice(0, colonIndex).trim();
          let value = line.slice(colonIndex + 1).trim();
          if ((value.startsWith('"') && value.endsWith('"')) || (value.startsWith("'") && value.endsWith("'"))) {
            value = value.slice(1, -1);
          }
          data[key] = value;
        }
      });

      const body = text.replace(/^---\r?\n[\s\S]*?\r?\n---/, '').trim();
      if (body && !data.description) {
        data.description = body;
      }

      return data;
    }

    async function loadDirectoryFiles(folder, containerId, renderFn) {
      const container = document.getElementById(containerId);
      if (!container) return;

      try {
        const apiUrl = `https://api.github.com/repos/${USERNAME}/${REPO}/contents/content/${folder}`;
        const res = await fetch(apiUrl);

        if (res.status === 404) {
          container.innerHTML = '<p class="empty-msg">尚無內容，請至後台新增。</p>';
          return;
        }

        if (!res.ok) throw new Error(`HTTP error! status: ${res.status}`);

        const files = await res.json();
        const mdFiles = files.filter(f => f.name.endsWith('.md'));

        if (mdFiles.length === 0) {
          container.innerHTML = '<p class="empty-msg">尚無內容，請至後台新增。</p>';
          return;
        }

        container.innerHTML = '';
        for (const file of mdFiles) {
          const rawRes = await fetch(file.download_url + '?t=' + new Date().getTime());
          const text = await rawRes.text();
          const data = parseFrontMatter(text);
          container.innerHTML += renderFn(data);
        }
      } catch (err) {
        console.warn(`[${folder}] 讀取狀態:`, err);
        container.innerHTML = `<p class="empty-msg">尚無內容，請至後台新增。</p>`;
      }
    }

    function isValidUrl(string) {
      if (!string || typeof string !== 'string' || string.trim() === '') return false;
      try {
        const url = new URL(string.trim());
        return url.protocol === 'http:' || url.protocol === 'https:';
      } catch (_) {
        return false;
      }
    }

    function renderResearch(data) {
      const tags = data.tags ? data.tags.split(/[,;]/).map(t => `<span class="tag">${t.trim()}</span>`).join('') : '';
      const hasLink = isValidUrl(data.link);
      
      const focalX = formatFocal(data.focal_x);
      const focalY = formatFocal(data.focal_y);
      
      const coverUrl = getImageUrl(data.cover);
      const coverHtml = coverUrl 
        ? `<div class="card-cover-wrapper"><img src="${coverUrl}" class="card-cover" style="object-position: ${focalX} ${focalY};" alt="封面" onerror="this.parentElement.style.display='none'"></div>` 
        : '';

      return `
        <div class="card">
          ${coverHtml}
          <div class="card-body">
            <div>
              <h3>${data.title || '無標題'}</h3>
              ${tags ? `<div class="tags-wrapper">${tags}</div>` : ''}
              <p>${data.description || ''}</p>
            </div>
            ${hasLink ? `<a href="${data.link}" target="_blank" class="btn">查看論文/連結</a>` : ''}
          </div>
        </div>
      `;
    }

    function renderVideo(data) {
      const focalX = formatFocal(data.focal_x);
      const focalY = formatFocal(data.focal_y);
      let coverUrl = getImageUrl(data.cover);

      if (!coverUrl && data.youtube_url) {
        const ytId = getYoutubeId(data.youtube_url);
        if (ytId) coverUrl = `https://img.youtube.com/vi/${ytId}/hqdefault.jpg`;
      }

      const coverHtml = coverUrl 
        ? `<div class="card-cover-wrapper"><img src="${coverUrl}" class="card-cover" style="object-position: ${focalX} ${focalY};" alt="封面" onerror="this.parentElement.style.display='none'"></div>` 
        : '';

      return `
        <div class="card">
          ${coverHtml}
          <div class="card-body">
            <div>
              <h3>${data.title || '無標題'}</h3>
              <p>${data.description || ''}</p>
            </div>
            ${data.youtube_url ? `<a href="${data.youtube_url}" target="_blank" class="btn">觀看影片</a>` : ''}
          </div>
        </div>
      `;
    }

    function renderProject(data) {
      const focalX = formatFocal(data.focal_x);
      const focalY = formatFocal(data.focal_y);
      const coverUrl = getImageUrl(data.cover);
      const coverHtml = coverUrl 
        ? `<div class="card-cover-wrapper"><img src="${coverUrl}" class="card-cover" style="object-position: ${focalX} ${focalY};" alt="封面" onerror="this.parentElement.style.display='none'"></div>` 
        : '';

      return `
        <div class="card">
          ${coverHtml}
          <div class="card-body">
            <div>
              <h3>${data.title || '無標題'}</h3>
              <p style="margin-bottom:0.5rem; font-size:0.88rem; color:#64748b;">
                <strong>角色：</strong>${data.role || '-'}<br>
                <strong>時間：</strong>${data.period || '-'}
              </p>
              <p>${data.description || ''}</p>
            </div>
          </div>
        </div>
      `;
    }

    function renderCompetition(data) {
      const focalX = formatFocal(data.focal_x);
      const focalY = formatFocal(data.focal_y);
      const coverUrl = getImageUrl(data.cover);
      const coverHtml = coverUrl 
        ? `<div class="card-cover-wrapper"><img src="${coverUrl}" class="card-cover" style="object-position: ${focalX} ${focalY};" alt="封面" onerror="this.parentElement.style.display='none'"></div>` 
        : '';

      return `
        <div class="card">
          ${coverHtml}
          <div class="card-body">
            <div>
              <h3>${data.title || '無標題'}</h3>
              <p style="margin-bottom:0.5rem; font-size:0.88rem; color:#64748b;">
                <strong>獎項：</strong>${data.award || data.role || '-'}<br>
                <strong>時間：</strong>${data.period || data.date || '-'}
              </p>
              <p>${data.description || ''}</p>
            </div>
          </div>
        </div>
      `;
    }

    document.addEventListener('DOMContentLoaded', () => {
      loadDirectoryFiles('research', 'research-list', renderResearch);
      loadDirectoryFiles('videos', 'videos-list', renderVideo);
      loadDirectoryFiles('plans', 'plans-list', renderProject);
      loadDirectoryFiles('competitions', 'competitions-list', renderCompetition);
    });
  </script>
</body>
</html>
