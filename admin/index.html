<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>後台內容管理系統</title>
  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
</head>
<body>
  <!-- 載入 Decap CMS -->
  <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>

  <script>
    // 註冊「研究成果」自訂卡片預覽
    CMS.registerPreviewTemplate('research', createClass({
      render: function() {
        var entry = this.props.entry;
        var title = entry.getIn(['data', 'title']) || '我是研究標題';
        var tagsStr = entry.getIn(['data', 'tags']) || '';
        var description = entry.getIn(['data', 'description']) || '';
        var link = entry.getIn(['data', 'link']);

        var tags = tagsStr ? tagsStr.split(/[,;]/).map(function(t) { return t.trim(); }).filter(Boolean) : [];
        var hasLink = link && link !== '000000' && link.trim() !== '';

        var h = window.React.createElement;

        return h('div', { style: { padding: '20px', background: '#f8f9fa', minHeight: '100vh', fontFamily: '-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif' } },
          h('div', {
            style: {
              background: '#ffffff',
              borderRadius: '12px',
              padding: '24px',
              border: '1px solid #e2e8f0',
              boxShadow: '0 4px 6px -1px rgba(0, 0, 0, 0.08)',
              maxWidth: '380px',
              margin: '0 auto'
            }
          },
            // 標題
            h('h3', { style: { fontSize: '1.25rem', color: '#0f172a', marginBottom: '12px', fontWeight: 'bold', lineHeight: '1.3' } }, title),
            
            // 標籤
            tags.length > 0 ? h('div', { style: { marginBottom: '14px', display: 'flex', flexWrap: 'wrap', gap: '6px' } },
              tags.map(function(tag, idx) {
                return h('span', {
                  key: idx,
                  style: {
                    background: '#eff6ff',
                    color: '#2563eb',
                    padding: '4px 10px',
                    borderRadius: '6px',
                    fontSize: '0.85rem',
                    fontWeight: '600'
                  }
                }, tag);
              })
            ) : null,

            // 摘要
            h('p', { style: { color: '#475569', fontSize: '0.95rem', lineHeight: '1.6', marginBottom: '16px', whiteSpace: 'pre-wrap' } }, description),

            // 查看連結按鈕
            hasLink ? h('a', {
              href: link,
              target: '_blank',
              style: {
                display: 'block',
                textAlign: 'center',
                background: '#2563eb',
                color: '#ffffff',
                padding: '8px 16px',
                borderRadius: '6px',
                textDecoration: 'none',
                fontSize: '0.9rem',
                fontWeight: '500'
              }
            }, '查看論文/連結') : null
          )
        );
      }
    }));
  </script>
</body>
</html>
