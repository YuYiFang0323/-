<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>後台內容管理系統</title>
  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
</head>
<body>
  <!-- 載入 Decap CMS -->
  <script src="https://cdn.jsdelivr.net/npm/decap-cms@^3.0.0/dist/decap-cms.js"></script>
  
  <script>
    // 註冊自訂預覽範本
    CMS.registerPreviewTemplate('research', window.createClass({
      render: function() {
        var entry = this.props.entry;
        var title = entry.getIn(['data', 'title']) || '（請輸入標題）';
        var tagsStr = entry.getIn(['data', 'tags']) || '';
        var description = entry.getIn(['data', 'description']) || '（請輸入摘要簡述）';
        var link = entry.getIn(['data', 'link']);

        // 處理標籤 (以逗號切分)
        var tags = tagsStr ? tagsStr.split(/[,;]/).map(function(t) { return t.trim(); }).filter(Boolean) : [];

        return window.h('div', { 
          style: { 
            padding: '40px 20px', 
            background: '#f8f9fa', 
            minHeight: '100vh', 
            boxSizing: 'border-box',
            fontFamily: '-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif' 
          } 
        },
          // 卡片本體
          window.h('div', {
            style: {
              background: '#ffffff',
              borderRadius: '16px',
              padding: '24px',
              border: '1px solid #e2e8f0',
              boxShadow: '0 10px 15px -3px rgba(0, 0, 0, 0.05)',
              maxWidth: '360px',
              margin: '0 auto'
            }
          },
            // 論文標題
            window.h('h3', { 
              style: { 
                fontSize: '1.25rem', 
                color: '#0f172a', 
                marginBottom: '12px', 
                fontWeight: '700', 
                lineHeight: '1.4' 
              } 
            }, title),
            
            // 標籤方塊
            tags.length > 0 ? window.h('div', { 
              style: { 
                marginBottom: '14px', 
                display: 'flex', 
                flexWrap: 'wrap', 
                gap: '6px' 
              } 
            },
              tags.map(function(tag, idx) {
                return window.h('span', {
                  key: idx,
                  style: {
                    background: '#eff6ff',
                    color: '#2563eb',
                    padding: '4px 10px',
                    borderRadius: '6px',
                    fontSize: '0.8rem',
                    fontWeight: '600'
                  }
                }, tag);
              })
            ) : null,

            // 摘要內文 (自動折行、絕對不破版)
            window.h('p', { 
              style: { 
                color: '#475569', 
                fontSize: '0.9rem', 
                lineHeight: '1.6', 
                marginBottom: '16px', 
                whiteSpace: 'pre-wrap', 
                wordBreak: 'break-word' 
              } 
            }, description),

            // 按鈕
            (link && link !== '000000') ? window.h('div', {
              style: {
                textAlign: 'center',
                background: '#2563eb',
                color: '#ffffff',
                padding: '8px 14px',
                borderRadius: '6px',
                fontSize: '0.85rem',
                fontWeight: '600'
              }
            }, '查看論文 / PDF') : null
          )
        );
      }
    }));
  </script>
</body>
</html>
