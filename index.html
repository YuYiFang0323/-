<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>個人作品集 Portfolio</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      line-height: 1.6;
      color: #2c3e50;
      background-color: #f8f9fa;
    }

    /* 頂部導覽列 */
    header {
      background: #ffffff;
      border-bottom: 1px solid #e9ecef;
      position: sticky;
      top: 0;
      z-index: 1000;
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
    }
    nav {
      max-width: 1000px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1.2rem 2rem;
    }
    .logo {
      font-size: 1.3rem;
      font-weight: 700;
      color: #1a252f;
      text-decoration: none;
    }
    .nav-links {
      display: flex;
      gap: 1.8rem;
      list-style: none;
    }
    .nav-links a {
      color: #495057;
      text-decoration: none;
      font-weight: 500;
      transition: color 0.2s;
    }
    .nav-links a:hover {
      color: #3b82f6;
    }

    /* 主要內容區域 */
    .container {
      max-width: 1000px;
      margin: 0 auto;
      padding: 3rem 1.5rem;
    }

    /* 各區塊標題設計 */
    section {
      margin-bottom: 4rem;
      text-align: center;
    }
    section h2 {
      font-size: 2rem;
      color: #1e293b;
      margin-bottom: 0.5rem;
      display: inline-block;
      position: relative;
    }
    section h2::after {
      content: '';
      display: block;
      width: 45px;
      height: 4px;
      background: #3b82f6;
      margin: 8px auto 0 auto;
      border-radius: 2px;
    }

    /* 卡片網格與樣式 */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 1.8rem;
      margin-top: 2rem;
      text-align: left;
    }

    .card {
      background: #ffffff;
      border-radius: 10px;
      padding: 1.8rem;
      border: 1px solid #e2e8f0;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
      transition: transform 0.2s, box-shadow 0.2s;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .card:hover {
      transform: translateY(-4px);
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
    }
    .card h3 {
      font-size: 1.25rem;
      color: #0f172a;
      margin-bottom: 0.8rem;
      line-height: 1.4;
    }
    .card .tags-wrapper {
      margin-bottom: 0.8rem;
    }
    .card .tag {
      display: inline-block;
      background: #eff6ff;
      color: #2563eb;
      padding: 0.25rem 0.6rem;
      border-radius: 4px;
      font-size: 0.82rem;
      font-weight: 500;
      margin-right: 0.4rem;
      margin-bottom: 0.4rem;
    }
    .card p {
      color: #475569;
      font-size: 0.95rem;
      margin-bottom: 1.2rem;
      white-space: pre-line;
      flex-grow: 1;
    }
    .card a.btn {
      display: inline-block;
      text-align: center;
      background: #3b82f6;
      color: #ffffff;
      padding: 0.5rem 1rem;
      border-radius: 6px;
      text-decoration: none;
      font-size: 0.9rem;
      font-weight: 500;
      transition: background 0.2s;
    }
    .card a.btn:hover {
      background: #2563eb;
    }

    /* 空資料提示文字 */
    .empty-msg {
      grid-column: 1 / -1;
      text-align: center;
      color: #94a3b8;
      font-size: 1rem;
      padding: 2rem 0;
    }
  </style>
</head>
<body>

  <header>
    <nav>
      <a href="#" class="logo">My Portfolio</a>
      <ul class="nav-links">
        <li><a href="#research">研究成果</a></li>
        <li><a href="#videos">影音作品</a></li>
        <li><a href="#plans">計畫作品</a></li>
        <li><a href="#competitions">競賽獲獎</a></li>
      </ul>
    </nav>
  </header>

  <div class="container">
    <section id="research">
      <h2>研究成果</h2>
      <div id="research-list" class="grid"><p class="empty-msg">正在讀取研究成果...</p></div>
    </section>

    <section id="videos">
      <h2>影音作品</h2>
      <div id="videos-list" class="grid"><p class="empty-msg">正在讀取影音作品...</p></div>
    </section>

    <section id="plans">
      <h2>計畫作品</h2>
      <div id="plans-list" class="grid"><p class="empty-msg">正在讀取計畫作品...</p></div>
    </section>

    <section id="competitions">
      <h2>競賽獲獎</h2>
      <div id="competitions-list" class="grid"><p class="empty-msg">正在讀取競賽獲獎...</p></div>
    </section>
  </div>
 
  <script>
    // -------------------------------------------------------------
    // 請在此處填入你真實的 GitHub 帳號與專案名稱 (Repo Name)
    // -------------------------------------------------------------
    const GITHUB_USERNAME = "YOUR_GITHUB_USERNAME"; // 例如: "alex123"
    const REPO_NAME = "YOUR_REPO_NAME";             // 例如: "my-portfolio"
    // -------------------------------------------------------------

    // 解析 YAML Front Matter (Markdown 檔案開頭區塊)
    function parseFrontMatter(text) {
      const match = text.match(/^---\r?\n([\s\S]*?)\r?\n---/);
      if (!match) return {};
      const yamlText = match[1];
      const data = {};
      yamlText.split('\n').forEach(line => {
        const colonIndex = line.indexOf(':');
        if (colonIndex !== -1) {
          const key = line.slice(0, colonIndex).trim();
          let value = line.slice(colonIndex + 1).trim();
          if ((value.startsWith('"') && value.endsWith('"')) || (value.startsWith("'") && value.endsWith("'"))) {
            value = value.slice(1, -1);
          }
          data[key] = value;
        }
      });
      return data;
    }

    // 抓取 Collection 資料
    async function fetchCollection(folder, containerId, renderFn) {
      const container = document.getElementById(containerId);
      try {
        // 動態組出正確的 GitHub API 網址
        const apiUrl = `https://api.github.com/repos/${GITHUB_USERNAME}/${REPO_NAME}/contents/content/${folder}`;
        const res = await fetch(apiUrl);
      
        if (res.ok) {
          const files = await res.json();
          const mdFiles = files.filter(f => f.name.endsWith('.md'));
        
          if (mdFiles.length === 0) {
            container.innerHTML = '<p class="empty-msg">尚無內容，請至後台新增。</p>';
            return;
          }

          container.innerHTML = '';
          for (const file of mdFiles) {
            const rawRes = await fetch(file.download_url);
            const content = await rawRes.text();
            const data = parseFrontMatter(content);
            container.innerHTML += renderFn(data);
          }
        } else {
          container.innerHTML = '<p class="empty-msg">尚無內容，請至後台新增。</p>';
        }
      } catch (err) {
        console.error(err);
        container.innerHTML = '<p class="empty-msg">讀取資料時發生錯誤。</p>';
      }
    }

    // 各類別卡片 HTML 產生函式
    function renderResearch(data) {
      const tags = data.tags ? data.tags.split(/[,;]/).map(t => `<span class="tag">${t.trim()}</span>`).join('') : '';
      const hasLink = data.link && data.link !== '000000' && data.link.trim() !== '';
      return `
        <div class="card">
          <div>
            <h3>${data.title || '無標題'}</h3>
            ${tags ? `<div class="tags-wrapper">${tags}</div>` : ''}
            <p>${data.description || ''}</p>
          </div>
          ${hasLink ? `<a href="${data.link}" target="_blank" class="btn">查看論文/連結</a>` : ''}
        </div>
      `;
    }

    function renderVideo(data) {
      return `
        <div class="card">
          <div>
            <h3>${data.title || '無標題'}</h3>
            <p>${data.description || ''}</p>
          </div>
          ${data.youtube_url ? `<a href="${data.youtube_url}" target="_blank" class="btn">觀看影片</a>` : ''}
        </div>
      `;
    }

    function renderProject(data) {
      return `
        <div class="card">
          <div>
            <h3>${data.title || '無標題'}</h3>
            <p style="margin-bottom:0.5rem; font-size:0.88rem; color:#64748b;">
              <strong>角色：</strong>${data.role || '-'}<br>
              <strong>時間：</strong>${data.period || '-'}
            </p>
            <p>${data.description || ''}</p>
          </div>
        </div>
      `;
    }

    // 頁面載入完成後執行
    document.addEventListener('DOMContentLoaded', () => {
      fetchCollection('research', 'research-list', renderResearch);
      fetchCollection('videos', 'videos-list', renderVideo);
      fetchCollection('plans', 'plans-list', renderProject);
      fetchCollection('competitions', 'competitions-list', renderProject);
    });
  </script>
</body>
</html>
